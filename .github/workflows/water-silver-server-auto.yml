name: Water Silver server migration

on:
  push:
    branches:
      - agent/water-silver-server-auto

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/water-silver-server-auto
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Apply source migration
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = read(path)
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern}")
              write(path, new)

          reward_fn = r'''func (w *World) grantItemInstanceReward(inst *ItemInstance, now time.Time) (itemInstanceRewardReceipt, bool) {
          	if inst == nil {
          		return itemInstanceRewardReceipt{}, false
          	}
          	if inst.RewardGranted {
          		return itemInstanceRewardReceipt{}, true
          	}
          	oldRewardGranted, oldExitAt, oldExitDeadline := inst.RewardGranted, inst.ExitAt, inst.ExitDeadline
          	finish := func() {
          		inst.RewardGranted = true
          		inst.ExitAt = now.Add(10 * time.Second)
          		inst.ExitDeadline = inst.ExitAt
          	}
          	persistRewardState := func(account *model.Account) error {
          		if _, transactional := w.store.(instanceRuntimeTransactionStore); transactional {
          			if account != nil {
          				return w.saveAccountsAndInstanceState(account)
          			}
          			return w.saveAccountsAndInstanceState()
          		}
          		if account != nil {
          			if isDurablePrivateWaterInstance(inst) || sharedTimedInstance(inst.Config) ||
          				strings.EqualFold(strings.TrimSpace(inst.Config.StateMachine), "hell_gate") {
          				return fmt.Errorf("store does not support atomic account/instance persistence")
          			}
          			return w.saveAccount(account)
          		}
          		return w.persistInstanceState()
          	}
          	if inst.Config.RewardItem == 0 {
          		finish()
          		if err := persistRewardState(nil); err != nil {
          			inst.RewardGranted, inst.ExitAt, inst.ExitDeadline = oldRewardGranted, oldExitAt, oldExitDeadline
          			log.Printf("INSTANCIA %q: salvar transicao sem recompensa: %v", inst.Config.ID, err)
          			return itemInstanceRewardReceipt{}, false
          		}
          		return itemInstanceRewardReceipt{}, true
          	}
          	leader := w.playersByID[inst.LeaderID]
          	if leader == nil || !leader.InWorld || leader.Char == nil {
          		return itemInstanceRewardReceipt{}, false
          	}
          	reward, err := materializeItem(model.Item{Index: inst.Config.RewardItem})
          	if err != nil {
          		log.Printf("INSTANCIA %q: materializar recompensa %d: %v",
          			inst.Config.ID, inst.Config.RewardItem, err)
          		return itemInstanceRewardReceipt{}, false
          	}
          	slot := firstFreeVisibleInventorySlot(leader.Char)
          	if slot < 0 {
          		if w.groundItems == nil {
          			w.groundItems = make(map[uint16]*GroundItem)
          		}
          		ground := w.createGroundDropForInstance(leader.X, leader.Y, reward, true, inst.RuntimeID)
          		if ground == nil {
          			return itemInstanceRewardReceipt{}, false
          		}
          		finish()
          		if err := persistRewardState(leader.Account); err != nil {
          			w.publishItemRemove(ground)
          			delete(w.groundItems, ground.ID)
          			inst.RewardGranted, inst.ExitAt, inst.ExitDeadline = oldRewardGranted, oldExitAt, oldExitDeadline
          			log.Printf("INSTANCIA %q: salvar recompensa %d no chao: %v",
          				inst.Config.ID, inst.Config.RewardItem, err)
          			return itemInstanceRewardReceipt{}, false
          		}
          		leader.Session.Send(wire.MessagePanel("Inventory full: the next Water Scroll was dropped."))
          		return itemInstanceRewardReceipt{}, true
          	}

          	leader.Char.Inv[slot] = reward
          	// O grant e a primeira fronteira duravel. O recibo server-side conserva
          	// o UID exato materializado para que uma automacao posterior jamais
          	// consuma outro pergaminho do mesmo indice.
          	finish()
          	if err := persistRewardState(leader.Account); err != nil {
          		leader.Char.Inv[slot] = model.Item{}
          		inst.RewardGranted, inst.ExitAt, inst.ExitDeadline = oldRewardGranted, oldExitAt, oldExitDeadline
          		log.Printf("INSTANCIA %q: salvar recompensa %d: %v",
          			inst.Config.ID, inst.Config.RewardItem, err)
          		return itemInstanceRewardReceipt{}, false
          	}
          	leader.Session.Send(wire.SendItem(leader.ID, placeInv, byte(slot), reward))
          	leader.Session.Send(wire.MessagePanel("You received the next Water Scroll."))
          	log.Printf("[#%d] INSTANCIA %q concluida: item %d -> inv[%d]",
          		leader.Session.ID, inst.Config.ID, inst.Config.RewardItem, slot)
          	return itemInstanceRewardReceipt{
          		Slot: byte(slot), ItemIndex: reward.Index, ItemUID: reward.UID,
          	}, true
          }'''

          regex_once(
              "internal/game/item_instances.go",
              r'func \(w \*World\) grantItemInstanceReward\(inst \*ItemInstance, now time\.Time\) bool \{.*?\n\}\n\nfunc \(w \*World\) completeItemInstance',
              reward_fn + "\n\nfunc (w *World) completeItemInstance",
          )

          old_complete = '''\tif w.grantItemInstanceReward(inst, now) {
          \t\tw.markInstanceStateDirty()
          \t}
          '''
          new_complete = '''\treceipt, ok := w.grantItemInstanceReward(inst, now)
          \tif !ok {
          \t\treturn
          \t}
          \tw.markInstanceStateDirty()
          \tw.tryWaterAutoAdvance(inst, receipt, now)
          '''
          replace_once("internal/game/item_instances.go", old_complete, new_complete)

          old_dispatch = '''\tcase "instance_ticket":
          \t\tw.useInstanceTicket(s, p, item, slot, rule, req)
          '''
          new_dispatch = '''\tcase "instance_ticket":
          \t\tif rule.Instance != nil && isDurablePrivateWaterConfig(*rule.Instance) {
          \t\t\tw.useWaterScroll(s, p, item, slot, rule, req, "")
          \t\t} else {
          \t\t\tw.useInstanceTicket(s, p, item, slot, rule, req)
          \t\t}
          '''
          replace_once("internal/game/consumables.go", old_dispatch, new_dispatch)

          water_auto = r'''package game

          import (
          	"strings"
          	"time"

          	"wydgo/internal/model"
          	"wydgo/internal/net"
          )

          // itemInstanceRewardReceipt existe somente entre as duas fronteiras
          // duraveis do encadeamento Water. O UID nunca vai ao wire.
          type itemInstanceRewardReceipt struct {
          	Slot      byte
          	ItemIndex uint16
          	ItemUID   string
          }

          func (r itemInstanceRewardReceipt) valid() bool {
          	return r.ItemIndex != 0 && strings.TrimSpace(r.ItemUID) != "" &&
          		int(r.Slot) < model.PlayerCarrySlots
          }

          // useWaterScroll e a unica entrada de dominio para pergaminhos Water.
          // O clique do client e o auto-avanco da Silver Angel convergem aqui;
          // apenas o primeiro nasce de um pacote 0x373. expectedUID vazio e uso
          // manual, enquanto o caminho automatico exige a instancia exata recem
          // concedida pelo servidor.
          func (w *World) useWaterScroll(s *net.Session, p *Player, item *model.Item,
          	slot byte, rule model.VolatileRule, req useItemRequest, expectedUID string) bool {
          	if w == nil || s == nil || p == nil || p.Char == nil || item == nil ||
          		rule.Instance == nil || !isDurablePrivateWaterConfig(*rule.Instance) ||
          		int(slot) >= model.PlayerCarrySlots {
          		return false
          	}
          	if expectedUID != "" && item.UID != expectedUID {
          		return false
          	}
          	before := w.itemInstanceForPlayer(p.ID)
          	w.useInstanceTicket(s, p, item, slot, rule, req)
          	after := w.itemInstanceForPlayer(p.ID)
          	return after != nil && after != before
          }

          // tryWaterAutoAdvance roda uma unica vez, imediatamente depois que o
          // grant do proximo scroll foi persistido. Nao varre inventario, nao
          // cria pacote sintetico e nao tenta novamente em ticker.
          func (w *World) tryWaterAutoAdvance(inst *ItemInstance,
          	receipt itemInstanceRewardReceipt, now time.Time) {
          	if w == nil || inst == nil || !receipt.valid() ||
          		!isDurablePrivateWaterInstance(inst) ||
          		inst.Config.RewardItem != receipt.ItemIndex ||
          		expectedChainItem(&inst.Config) != receipt.ItemIndex ||
          		!itemInstanceInExitGraceAt(inst, now) {
          		return
          	}
          	leader := w.playersByID[inst.LeaderID]
          	if leader == nil || !leader.InWorld || leader.Char == nil ||
          		leader.Account == nil || leader.Session == nil || playerCurHP(leader.Char) == 0 ||
          		!w.hasActiveSilverFairy(leader.Char) {
          		return
          	}
          	item := &leader.Char.Inv[receipt.Slot]
          	if item.Index != receipt.ItemIndex || item.UID != receipt.ItemUID {
          		return
          	}
          	rule, _, registered := w.volatiles.Rule(item.Index)
          	if !registered || rule.Action != "instance_ticket" || !rule.Consume ||
          		rule.Instance == nil || !isDurablePrivateWaterConfig(*rule.Instance) {
          		return
          	}
          	// Mesma fronteira comportamental do clique manual. O request aqui e
          	// apenas um valor de dominio; nenhum frame 0x373 e fabricado.
          	w.cancelTrade(leader, "Water auto-advance")
          	req := useItemRequest{srcType: placeInv, srcPos: uint32(receipt.Slot)}
          	w.useWaterScroll(leader.Session, leader, item, receipt.Slot, rule, req, receipt.ItemUID)
          }
          '''
          write("internal/game/water_auto.go", water_auto.replace("          ", ""))

          tests = r'''package game

          import (
          	"errors"
          	"testing"
          	"time"

          	"wydgo/internal/model"
          )

          func configureWaterSecondRoom(w *World) {
          	second := instanceTestRule()
          	second.Instance.ID = "water-normal-2"
          	second.Instance.ChainStart = false
          	second.Instance.X, second.Instance.Y = 2250, 2250
          	second.Instance.SpawnX, second.Instance.SpawnY = 2252, 2252
          	w.volatiles.Items[3174] = second
          	w.volatiles.ItemCodes[3174] = 21
          	w.items[3174] = model.ItemDef{Index: 3174}
          }

          func equipActiveSilverForWaterTest(t *testing.T, w *World, p *Player) {
          	t.Helper()
          	w.items[3914] = fairyTestDef(3914, 0)
          	p.Char.Equip[fairySlot] = fairyWithMinutes(t, w, 3914, 60)
          }

          func killOnlyInstanceMob(t *testing.T, w *World, inst *ItemInstance, now time.Time) {
          	t.Helper()
          	var mob *Mob
          	for id := range inst.MobIDs {
          		mob = w.mobsByID[id]
          		break
          	}
          	if mob == nil {
          		t.Fatal("instancia sem mob para concluir")
          	}
          	w.onItemInstanceMobKilled(mob, now)
          }

          func TestWaterSilverAutoAdvanceUsesGrantedScroll(t *testing.T) {
          	w, leader, member, _, clock := instanceTestWorld()
          	configureWaterSecondRoom(w)
          	equipActiveSilverForWaterTest(t, w, leader)

          	w.onUseItem(leader.Session, useItemPacket(0, 0))
          	first := w.itemInstances["water-normal-1"]
          	if first == nil {
          		t.Fatal("primeira sala nao abriu")
          	}
          	killOnlyInstanceMob(t, w, first, clock.Now())

          	second := w.itemInstances["water-normal-2"]
          	if second == nil || w.itemInstanceForPlayer(leader.ID) != second ||
          		w.itemInstanceForPlayer(member.ID) != second {
          		t.Fatalf("Silver Angel nao abriu a sala seguinte: second=%+v", second)
          	}
          	if leader.Char.Inv[0].Index != 0 {
          		t.Fatalf("scroll recem concedido nao foi consumido: %+v", leader.Char.Inv[0])
          	}
          	if itemInstanceHasMember(first, leader.ID) || itemInstanceHasMember(first, member.ID) {
          		t.Fatal("sala anterior manteve membros depois do auto-avanco")
          	}
          }

          func TestWaterAutoAdvanceRequiresSilverOnLeaderAtReward(t *testing.T) {
          	tests := []struct {
          		name string
          		setup func(*testing.T, *World, *Player, *Player)
          	}{
          		{name: "no fairy"},
          		{name: "silver only in inventory", setup: func(t *testing.T, w *World, leader, _ *Player) {
          			w.items[3914] = fairyTestDef(3914, 0)
          			leader.Char.Inv[6] = fairyWithMinutes(t, w, 3914, 60)
          		}},
          		{name: "silver on non leader", setup: func(t *testing.T, w *World, _, member *Player) {
          			equipActiveSilverForWaterTest(t, w, member)
          		}},
          	}
          	for _, tc := range tests {
          		t.Run(tc.name, func(t *testing.T) {
          			w, leader, member, _, clock := instanceTestWorld()
          			configureWaterSecondRoom(w)
          			if tc.setup != nil {
          				tc.setup(t, w, leader, member)
          			}
          			w.onUseItem(leader.Session, useItemPacket(0, 0))
          			first := w.itemInstances["water-normal-1"]
          			killOnlyInstanceMob(t, w, first, clock.Now())
          			if w.itemInstances["water-normal-2"] != nil {
          				t.Fatal("auto-avanco ocorreu sem Silver Angel ativa no lider")
          			}
          			if leader.Char.Inv[0].Index != 3174 || leader.Char.Inv[0].UID == "" {
          				t.Fatalf("reward deveria permanecer duravel no carry: %+v", leader.Char.Inv[0])
          			}
          		})
          	}
          }

          func TestWaterSilverDoesNotRetroactivelyAdvance(t *testing.T) {
          	w, leader, _, _, clock := instanceTestWorld()
          	configureWaterSecondRoom(w)
          	w.onUseItem(leader.Session, useItemPacket(0, 0))
          	first := w.itemInstances["water-normal-1"]
          	killOnlyInstanceMob(t, w, first, clock.Now())
          	if w.itemInstances["water-normal-2"] != nil {
          		t.Fatal("sala seguinte abriu sem fada")
          	}
          	equipActiveSilverForWaterTest(t, w, leader)
          	clock.Advance(time.Second)
          	w.tickItemInstances(clock.Now())
          	if w.itemInstances["water-normal-2"] != nil || leader.Char.Inv[0].Index != 3174 {
          		t.Fatal("equipar a fada depois do reward acionou auto-avanco retroativo")
          	}
          }

          func TestWaterSilverConsumesOnlyNewRewardUID(t *testing.T) {
          	w, leader, _, _, clock := instanceTestWorld()
          	configureWaterSecondRoom(w)
          	equipActiveSilverForWaterTest(t, w, leader)
          	older, err := materializeItem(model.Item{Index: 3174})
          	if err != nil {
          		t.Fatal(err)
          	}
          	leader.Char.Inv[5] = older

          	w.onUseItem(leader.Session, useItemPacket(0, 0))
          	first := w.itemInstances["water-normal-1"]
          	killOnlyInstanceMob(t, w, first, clock.Now())
          	if w.itemInstances["water-normal-2"] == nil {
          		t.Fatal("Silver Angel nao abriu sala seguinte")
          	}
          	if leader.Char.Inv[5].UID != older.UID || leader.Char.Inv[5].Index != 3174 {
          		t.Fatalf("scroll antigo do mesmo indice foi consumido: before=%+v after=%+v",
          			older, leader.Char.Inv[5])
          	}
          }

          func TestWaterSilverFullInventoryKeepsGroundFallback(t *testing.T) {
          	w, leader, _, _, clock := instanceTestWorld()
          	configureWaterSecondRoom(w)
          	equipActiveSilverForWaterTest(t, w, leader)
          	w.onUseItem(leader.Session, useItemPacket(0, 0))
          	first := w.itemInstances["water-normal-1"]
          	for slot := 0; slot < model.PlayerCarrySlots; slot++ {
          		leader.Char.Inv[slot] = model.Item{Index: 500}
          	}
          	killOnlyInstanceMob(t, w, first, clock.Now())
          	if w.itemInstances["water-normal-2"] != nil {
          		t.Fatal("reward no chao nao pode acionar auto-avanco")
          	}
          	if len(w.groundItems) == 0 {
          		t.Fatal("inventario cheio nao gerou fallback de reward no chao")
          	}
          }

          func TestWaterSilverGrantPersistenceFailureDoesNotAdvance(t *testing.T) {
          	w, leader, _, st, clock := instanceTestWorld()
          	configureWaterSecondRoom(w)
          	equipActiveSilverForWaterTest(t, w, leader)
          	w.onUseItem(leader.Session, useItemPacket(0, 0))
          	first := w.itemInstances["water-normal-1"]
          	st.err = errors.New("reward commit failed")
          	killOnlyInstanceMob(t, w, first, clock.Now())
          	if first.RewardGranted || w.itemInstances["water-normal-2"] != nil || leader.Char.Inv[0].Index != 0 {
          		t.Fatalf("falha do grant deixou estado parcial: reward=%v next=%v inv=%+v",
          			first.RewardGranted, w.itemInstances["water-normal-2"], leader.Char.Inv[0])
          	}
          }

          type failWaterTransitionStore struct {
          	guildFlowStore
          	failed bool
          }

          func (s *failWaterTransitionStore) SaveGameStateWithInstanceState(g *model.GuildRegistry,
          	snapshot *model.InstanceStateSnapshot, accounts ...*model.Account) error {
          	if snapshot != nil && len(snapshot.Instances) >= 2 && !s.failed {
          		s.failed = true
          		return errors.New("next room commit failed")
          	}
          	return s.guildFlowStore.SaveGameStateWithInstanceState(g, snapshot, accounts...)
          }

          func TestWaterSilverTransitionFailureLeavesExactGrantedScroll(t *testing.T) {
          	w, leader, _, baseStore, clock := instanceTestWorld()
          	configureWaterSecondRoom(w)
          	equipActiveSilverForWaterTest(t, w, leader)
          	older, err := materializeItem(model.Item{Index: 3174})
          	if err != nil {
          		t.Fatal(err)
          	}
          	leader.Char.Inv[5] = older
          	failing := &failWaterTransitionStore{guildFlowStore: *baseStore}
          	w.store = failing

          	w.onUseItem(leader.Session, useItemPacket(0, 0))
          	first := w.itemInstances["water-normal-1"]
          	killOnlyInstanceMob(t, w, first, clock.Now())

          	if !failing.failed {
          		t.Fatal("segunda fronteira de persistencia nao foi exercitada")
          	}
          	if w.itemInstances["water-normal-2"] != nil {
          		t.Fatal("sala seguinte foi publicada apesar da falha de persistencia")
          	}
          	granted := leader.Char.Inv[0]
          	if granted.Index != 3174 || granted.UID == "" || granted.UID == older.UID {
          		t.Fatalf("scroll recem concedido nao sobreviveu ao rollback: granted=%+v older=%+v",
          			granted, older)
          	}
          	if leader.Char.Inv[5].UID != older.UID {
          		t.Fatal("rollback alterou o scroll antigo do mesmo indice")
          	}
          }

          func TestWaterSilverFinalRewardZeroDoesNotConsumeExistingScroll(t *testing.T) {
          	w, leader, _, _, clock := instanceTestWorld()
          	equipActiveSilverForWaterTest(t, w, leader)
          	existing, err := materializeItem(model.Item{Index: 3173})
          	if err != nil {
          		t.Fatal(err)
          	}
          	leader.Char.Inv[5] = existing
          	inst := &ItemInstance{
          		Config: model.VolatileInstance{
          			ID: "water-normal-boss", Mode: "private_chain", RewardItem: 0,
          			ChainNextItem: 3173, AllowChainDuringExitGrace: true,
          		},
          		RuntimeID: "water-normal-boss", LeaderID: leader.ID, MemberIDs: []uint16{leader.ID},
          	}
          	w.itemInstances[inst.RuntimeID] = inst
          	w.indexInstanceMembers(inst)
          	w.completeItemInstance(inst, clock.Now())
          	if leader.Char.Inv[5].UID != existing.UID || leader.Char.Inv[5].Index != 3173 {
          		t.Fatal("reward zero consumiu scroll preexistente")
          	}
          }
          '''
          write("internal/game/water_auto_test.go", tests.replace("          ", ""))

          # Retira o elo WaterMacro do orquestrador. Clientes versionados com o
          # elo antigo sao reconstruidos a partir do original, nunca despachados
          # por uma edicao binaria ad-hoc.
          apply_path = "client748/Apply-WYD748.ps1"
          text = read(apply_path)
          text = text.replace("# seis scripts Patch-WYD748-*.ps1 abaixo continuam separados de proposito:",
                              "# cinco scripts Patch-WYD748-*.ps1 abaixo continuam separados de proposito:")
          text = text.replace("# 6. Patch-WYD748-WaterMacro.ps1   macro local de pergaminhos Water\n", "")
          old_tail = '''    # ETAPA 5 — constante 4010 -> 3448 da receita nativa da Lindy.
          [pscustomobject]@{
              Number = 5; Name = 'receita da Lindy'; Script = 'Patch-WYD748-Lindy.ps1'
              Input = '4E916C1FD94D60D5EF7F8914B621BAB3787E7BF5460FB251C59F71BCC4D9BA2F'
              Output = '9762B1AC6EFB4AB3C800877DE1DA048DD43EA407FCEEA945C755DF6986607F18'
          },
          # ETAPA 6 — scanner local de Water; continua server-side autoritativo.
          [pscustomobject]@{
              Number = 6; Name = 'macro de pergaminhos Water'; Script = 'Patch-WYD748-WaterMacro.ps1'
              Input = '9762B1AC6EFB4AB3C800877DE1DA048DD43EA407FCEEA945C755DF6986607F18'
              Output = '65486F2A4ED791BA977C00D1478BFA6450783DA37BC54A8039F196B8A73E0A0E'
          }
          )'''.replace("          ", "")
          new_tail = '''    # ETAPA 5 — constante 4010 -> 3448 da receita nativa da Lindy.
          [pscustomobject]@{
              Number = 5; Name = 'receita da Lindy'; Script = 'Patch-WYD748-Lindy.ps1'
              Input = '4E916C1FD94D60D5EF7F8914B621BAB3787E7BF5460FB251C59F71BCC4D9BA2F'
              Output = '9762B1AC6EFB4AB3C800877DE1DA048DD43EA407FCEEA945C755DF6986607F18'
          }
          )'''.replace("          ", "")
          if old_tail not in text:
              raise SystemExit("Apply-WYD748.ps1: six-step tail not found")
          text = text.replace(old_tail, new_tail, 1)
          marker = "$current = Get-Sha $Executable\n$final = $steps[-1].Output"
          migration = r'''$current = Get-Sha $Executable
          $legacyWaterMacroHashes = @(
              '65486F2A4ED791BA977C00D1478BFA6450783DA37BC54A8039F196B8A73E0A0E',
              'F76D9D8CEDFFBD3E046F10C5282CF0139E6D94BFC7DF30BCCA549324B0D1107E'
          )
          if ($legacyWaterMacroHashes -contains $current) {
              if ($VerifyOnly) {
                  Write-Host "WaterMacro legado detectado ($current). Execute sem -VerifyOnly para reconstruir o client ate o elo Lindy."
                  return
              }
              if (-not (Test-Path -LiteralPath $original -PathType Leaf)) {
                  throw "WaterMacro legado detectado, mas WYD.original.exe nao existe para reconstruir a cadeia."
              }
              $legacyBackup = Join-Path (Split-Path -Parent $Executable) 'WYD.pre-server-water.exe'
              if (-not (Test-Path -LiteralPath $legacyBackup -PathType Leaf)) {
                  Copy-Item -LiteralPath $Executable -Destination $legacyBackup
              }
              Copy-Item -LiteralPath $original -Destination $Executable -Force
              $current = Get-Sha $Executable
              Write-Host 'WaterMacro client-side removido; reconstruindo os cinco elos suportados.'
          }
          $final = $steps[-1].Output'''.replace("          ", "")
          if marker not in text:
              raise SystemExit("Apply-WYD748.ps1: current/final marker not found")
          text = text.replace(marker, migration, 1)
          write(apply_path, text)

          replace_once(
              "client748/Patch-WYD748-Lindy.ps1",
              "# Quinto elo da cadeia do client 7.48 (Lindy; WaterMacro e o sexto e ultimo).",
              "# Quinto e ultimo elo da cadeia do client 7.48.",
          )

          patches = read("client748/PATCHES.md")
          patches = patches.replace("resultado de seis\nscripts aplicados em ordem", "resultado de cinco\nscripts aplicados em ordem", 1)
          patches = patches.replace(
              "WYD.exe pós-Lindy             9762B1AC…7F18\n  └─ Patch-WYD748-WaterMacro.ps1             macro local de pergaminhos\nWYD.exe pós-WaterMacro        65486F2A…73E0A0E   ← binário atualmente versionado",
              "WYD.exe pós-Lindy             9762B1AC…7F18   ← binário atualmente versionado",
              1,
          )
          patches = patches.replace("## Fix da Lindy (penúltimo elo)", "## Fix da Lindy (último elo)", 1)
          patches = patches.replace("| `WYD.pre-water-macro.exe` | backup da entrada pós-Lindy do patch Water |\n", "")
          water_header = "## Water Scroll Macro (elo independente)"
          if water_header not in patches:
              raise SystemExit("PATCHES.md: WaterMacro section not found")
          patches = patches.split(water_header, 1)[0].rstrip() + r'''

          ## Water: automação somente server-side

          O antigo sexto elo `Patch-WYD748-WaterMacro.ps1` foi removido. Os
          comandos locais `/macropergaon` e `/macropergaoff`, o hook de chat, o
          scanner de Carry e a chamada automática da rotina nativa `UseItem` não
          fazem mais parte do executável suportado.

          O cliente versionado termina no hash pós-Lindy
          `9762B1AC6EFB4AB3C800877DE1DA048DD43EA407FCEEA945C755DF6986607F18`.
          `Apply-WYD748.ps1` reconhece os hashes antigos do WaterMacro, preserva
          uma cópia `WYD.pre-server-water.exe` e reconstrói o executável desde
          `WYD.original.exe` pelos cinco elos atuais.

          O encadeamento automático da Water pertence ao servidor: quando uma
          sala concede e persiste o próximo pergaminho no Carry do líder, uma
          Silver Angel (`3914`) ativa no `Equip[13]` autoriza o uso automático
          daquele **UID exato**. Inventário cheio conserva o drop no chão e não
          avança; falha do segundo commit conserva o pergaminho durável. Nenhum
          pacote `0x373` é fabricado pelo servidor.
          '''.replace("          ", "")
          write("client748/PATCHES.md", patches)

          water_doc = r'''# Water — cadeia de instâncias e Silver Angel

          ## Estado entregue

          Normal, Mystic e Arcane usam o mesmo motor `instance_ticket`, com uma
          `VolatileInstance` independente para cada sala e para o boss. Cada
          transição cria um novo `RuntimeID`; salas privadas concorrentes não
          compartilham mobs, visibilidade, loot ou estado.

          Ao zerar `Remaining`, a sala entrega `RewardItem` somente ao líder e
          persiste a recompensa junto ao estado da instância antes de publicar.
          Inventário cheio mantém o fallback nativo no chão. Depois da conclusão
          existe uma janela de saída de dez segundos em que somente o próximo
          ticket autoritativo da cadeia pode ser usado.

          As três sequências são:

          - Normal: `3173 -> ... -> 3180`, depois `3181` (boss), e `3173` fecha o ciclo;
          - Mystic: `777 -> ... -> 784`, depois `785`, e `777` fecha o ciclo;
          - Arcane: `3182 -> ... -> 3189`, depois `3190`, e `3182` fecha o ciclo.

          O boss não entrega Room 1. `ChainNextItem` expressa apenas que um
          Room 1 Scroll já existente pode iniciar novo ciclo durante a saída.
          `RewardItem` continua sendo a recompensa das salas que realmente
          concedem pergaminho.

          ## Auto-avanço com Fada Prateada

          A automação é exclusivamente server-side. No momento em que uma sala
          termina:

          1. o servidor materializa o próximo scroll com UID próprio;
          2. grava conta + estado da instância;
          3. publica o reward ao líder;
          4. verifica se o líder está com Silver Angel (`3914`) ativa em
             `Equip[13]`;
          5. se estiver, usa somente o UID recém-concedido pela mesma rotina de
             domínio usada pelo clique manual;
          6. a nova sala é persistida antes de teleporte/spawn/publicação.

          A fada no inventário não ativa automação. Equipá-la depois do reward
          não causa avanço retroativo. A fada de outro membro da party não conta.
          Reward no chão por Carry cheio não avança. Reward `0` não procura um
          scroll antigo. Se o commit da nova sala falhar, o runtime novo é
          revertido e o scroll concedido no primeiro commit permanece no Carry.

          O servidor não varre o inventário, não escolhe por índice e não cria um
          pacote `0x373`: o recibo interno carrega `slot + item index + UID`, e o
          caminho automático exige que esses três valores ainda coincidam com o
          estado autoritativo.

          ## Persistência e isolamento

          O agregado Water privado persiste UIDs dos personagens, UID do líder,
          `RewardGranted` e `ExitAt`. Logout remove o ClientID vivo, não a
          identidade persistente; o personagem pode ser reanexado pelo
          CharacterUID. Stores incapazes de confirmar conta+instância em uma
          transação recusam operações mistas em vez de dividir o estado.

          Visibilidade, combate, IA e itens de chão usam o mesmo `RuntimeID`.
          Quando uma party encadeia para a sala seguinte, a associação antiga é
          destacada dentro do snapshot durável; o cleanup posterior da sala velha
          não pode teleportar membros que já estão no novo runtime.

          ## Client 7.48

          `/macropergaon` e `/macropergaoff` foram removidos. O antigo
          `Patch-WYD748-WaterMacro.ps1`, seu teste e `tools/watermacrotable`
          também foram removidos. `Patch-WYD748-Macro.ps1` permanece: ele é o
          macro normal de skills/buffs e não depende da automação Water.

          A cadeia suportada do executável agora termina no patch da Lindy. Um
          binário legado com WaterMacro é reconhecido pelo orquestrador e
          reconstruído a partir do original, preservando os cinco patches
          anteriores.

          ## Cobertura

          `internal/game/water_test.go` mantém a cobertura de sequência manual,
          exit grace, anti-skip, Room 8 -> Boss, Boss -> Room 1, runtime privado,
          rollback e isolamento. `internal/game/water_auto_test.go` cobre Silver
          ativa, fada ausente/no inventário/no membro, ausência de retroatividade,
          UID duplicado do mesmo índice, Carry cheio, falha no grant, falha no
          segundo commit e reward zero.

          Validação do client:

          ```powershell
          cd client748
          .\Apply-WYD748.ps1 -VerifyOnly
          ```
          '''.replace("          ", "")
          write("DOCS/WATER.md", water_doc)

          # Limpa referências nominais obsoletas nos documentos agregados sem
          # reescrever suas demais seções.
          for doc in ("DOCS/IMPLEMENTATION_STATUS.md", "DOCS/plan.md"):
              d = read(doc)
              d = d.replace("`Patch-WYD748-WaterMacro.ps1`", "automação Water server-side pela Silver Angel")
              d = d.replace("`Test-WYD748-WaterMacro.ps1`", "`internal/game/water_auto_test.go`")
              d = d.replace("`tools/watermacrotable`", "`internal/game/water_auto.go`")
              d = d.replace("`/macropergaon`/`/macropergaoff`", "Silver Angel equipada")
              d = d.replace("/macropergaon`/`/macropergaoff", "Silver Angel equipada")
              write(doc, d)

          for obsolete in (
              "client748/Patch-WYD748-WaterMacro.ps1",
              "client748/Test-WYD748-WaterMacro.ps1",
              "tools/watermacrotable/main.go",
              "tools/watermacrotable/main_test.go",
          ):
              p = Path(obsolete)
              if p.exists():
                  p.unlink()
          '@ | Set-Content -LiteralPath .tmp-water-auto.py -Encoding utf8
          python .tmp-water-auto.py
          Remove-Item .tmp-water-auto.py -Force

      - name: Format Go
        shell: pwsh
        run: |
          gofmt -w internal/game/water_auto.go internal/game/water_auto_test.go internal/game/item_instances.go internal/game/consumables.go

      - name: Rebuild client without WaterMacro
        shell: pwsh
        run: |
          Push-Location client748
          .\Apply-WYD748.ps1
          .\Apply-WYD748.ps1 -VerifyOnly
          $hash = (Get-FileHash -LiteralPath .\WYD.exe -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($hash -ne '9762B1AC6EFB4AB3C800877DE1DA048DD43EA407FCEEA945C755DF6986607F18') {
            throw "WYD.exe final inesperado: $hash"
          }
          Pop-Location

      - name: Validate Go server
        shell: pwsh
        run: |
          go test -count=1 ./...
          go vet ./...
          New-Item -ItemType Directory -Force tmp | Out-Null
          go build -o tmp/tm-check.exe ./cmd/server
          git diff --check
          Remove-Item tmp/tm-check.exe -Force -ErrorAction SilentlyContinue

      - name: Ensure legacy WaterMacro references are gone
        shell: pwsh
        run: |
          $hits = git grep -n -E 'macropergao|Patch-WYD748-WaterMacro|Test-WYD748-WaterMacro|tools/watermacrotable' -- ':!DOCS/WATER.md' ':!client748/PATCHES.md'
          if ($LASTEXITCODE -eq 0 -and $hits) {
            $hits | Out-Host
            throw 'Referencias executaveis do WaterMacro ainda existem.'
          }

      - name: Commit validated migration
        shell: pwsh
        run: |
          Remove-Item .github/workflows/water-silver-server-auto.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: move Water auto-advance to Silver Angel server-side'
          git push origin HEAD:agent/water-silver-server-auto
