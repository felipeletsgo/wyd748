name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wydgo
          POSTGRES_PASSWORD: wydgo
          POSTGRES_DB: wydgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wydgo -d wydgo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WYD_TEST_POSTGRES_URL: postgres://wydgo:wydgo@127.0.0.1:5432/wydgo_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Coverage report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p tmp
          go test -count=1 -coverprofile=tmp/coverage.out \
            ./internal/account \
            ./internal/accountapi \
            ./internal/game \
            ./internal/loadtest \
            ./internal/model \
            ./internal/net \
            ./internal/networkpolicy \
            ./internal/store \
            ./internal/wire
          go tool cover -func=tmp/coverage.out | tee tmp/coverage.txt

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            tmp/coverage.out
            tmp/coverage.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Fuzz framing
        if: always()
        run: go test ./internal/wire -run=^$ -fuzz=FuzzReadPacketNeverPanics -fuzztime=5s

      - name: Fuzz trade parser
        if: always()
        run: go test ./internal/game -run=^$ -fuzz=FuzzParseTradeRequestNeverPanics -fuzztime=5s

      - name: Fuzz item parsers
        if: always()
        run: go test ./internal/game -run=^$ -fuzz=FuzzItemPacketParsersNeverPanic -fuzztime=5s

      - name: Race detector
        if: always()
        run: go test -race -count=1 ./internal/game ./internal/net ./internal/store ./internal/account ./internal/accountapi

      - name: Vet
        if: always()
        run: go vet ./...

      - name: Build server
        if: always()
        run: go build -o tmp/tm-check ./cmd/server

      - name: Check whitespace
        if: always()
        run: git diff --check

  client-assets:
    name: Client 7.48 static verification
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize required KR source assets
        shell: pwsh
        run: git lfs pull --include="CLIENTS/WYD/ItemList.bin,CLIENTS/WYD/mesh/ValidIndex.bin"

      - name: Verify reproducible patch chain
        shell: pwsh
        working-directory: client748
        run: .\Apply-WYD748.ps1 -VerifyOnly

      - name: Verify KR costumes
        shell: pwsh
        working-directory: client748
        run: .\Test-WYD748-Costumes.ps1

      - name: Verify KR mounts
        shell: pwsh
        working-directory: client748
        run: .\Test-WYD748-KRMounts.ps1

      - name: Verify KR mobs and poses
        shell: pwsh
        working-directory: client748
        run: .\Test-WYD748-KRMobs.ps1
