name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wydgo
          POSTGRES_PASSWORD: wydgo
          POSTGRES_DB: wydgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wydgo -d wydgo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WYD_TEST_POSTGRES_URL: postgres://wydgo:wydgo@127.0.0.1:5432/wydgo_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Store race detector
        run: go test -race -count=1 ./internal/store

      - name: Vet
        run: go vet ./...

      - name: Build server
        run: go build -o tmp/tm-check ./cmd/server

      - name: Check whitespace
        run: git diff --check
