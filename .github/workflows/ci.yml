name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository and research validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate documentation layout and links
        shell: pwsh
        run: ./tools/repository/Test-RepositoryLayout.ps1
      - name: Test research tooling
        run: python3 -m unittest discover -s .agents/skills/wyd-client748-research/scripts -p 'test_*.py'
      - name: Validate research records
        run: python3 .agents/skills/wyd-client748-research/scripts/validate_research.py

  go:
    name: Go validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wydgo748

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wydgo
          POSTGRES_PASSWORD: wydgo
          POSTGRES_DB: wydgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wydgo -d wydgo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WYD_TEST_POSTGRES_URL: postgres://wydgo:wydgo@127.0.0.1:5432/wydgo_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: wydgo748/go.mod
          cache-dependency-path: wydgo748/go.sum
          cache: true

      - name: Test server
        run: go test -count=1 ./...

      - name: Test store with race detector
        run: go test -race -count=1 ./internal/store

      - name: Vet server
        run: go vet ./...

      - name: Build server
        run: go build -o "$RUNNER_TEMP/tm-check" ./cmd/server

      - name: Check whitespace
        run: git diff --check
