name: KR mount native correction fast

on:
  push:
    branches:
      - agent/fix-kr-mount-native
    paths:
      - .github/workflows/kr-mount-native-fix-fast.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout full repository and KR LFS snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Pull only the KR ValidIndex LFS object
        shell: pwsh
        run: |
          git lfs install
          git lfs pull --include="CLIENTS/WYD/mesh/ValidIndex.bin" --exclude="*"

      - name: Configure Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Extract migration helper from the audited workflow payload
        shell: pwsh
        run: |
          $workflow = Get-Content .github/workflows/kr-mount-native-fix.yml
          $line = $workflow | Where-Object { $_ -match '^\s*KR_FIX_PAYLOAD:\s+(\S+)\s*$' } | Select-Object -First 1
          if (-not $line -or $line -notmatch '^\s*KR_FIX_PAYLOAD:\s+(\S+)\s*$') { throw 'migration payload not found' }
          $compressed = [Convert]::FromBase64String($Matches[1])
          $input = New-Object IO.MemoryStream(,$compressed)
          $gzip = New-Object IO.Compression.GZipStream($input,[IO.Compression.CompressionMode]::Decompress)
          $output = New-Object IO.MemoryStream
          $gzip.CopyTo($output)
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'kr_mount_native_fix.py'),$output.ToArray())
          $gzip.Dispose(); $input.Dispose(); $output.Dispose()

      - name: Apply source-backed mount corrections
        shell: pwsh
        run: |
          python (Join-Path $env:RUNNER_TEMP 'kr_mount_native_fix.py') prepare
          git rm -f --ignore-unmatch -- client748/mesh/hs010117.wys client748/mesh/KK010112.msh client748/mesh/KK010112.wys

      - name: Verify in-place data migration and clean rebuild equivalence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $legacyItem = Join-Path $env:RUNNER_TEMP 'ItemList.legacy.bin'
          Copy-Item client748/ItemList.bin $legacyItem
          & .\client748\Patch-WYD748-KRMountItems.ps1 -ItemList $legacyItem
          $legacyItemHash = (Get-FileHash $legacyItem -Algorithm SHA256).Hash.ToUpperInvariant()

          $legacyTextures = Join-Path $env:RUNNER_TEMP 'MeshTextureList.legacy.bin'
          Copy-Item client748/mesh/MeshTextureList.bin $legacyTextures
          & .\client748\Patch-WYD748-CostumeTextures.ps1 -MeshTextureList $legacyTextures
          $legacyTextureHash = (Get-FileHash $legacyTextures -Algorithm SHA256).Hash.ToUpperInvariant()

          python -c "import pathlib,subprocess; pathlib.Path(r'client748/ItemList.bin').write_bytes(subprocess.check_output(['git','show','cb4b43af4587ef3b8538a73221311598495a54dd:client748/ItemList.bin']))"
          & .\client748\Patch-WYD748-ClientItemUse.ps1 -ItemList .\client748\ItemList.bin
          & .\client748\Patch-WYD748-CostumeItems.ps1 -ItemList .\client748\ItemList.bin
          & .\client748\Patch-WYD748-KRMountItems.ps1 -ItemList .\client748\ItemList.bin
          $cleanItemHash = (Get-FileHash .\client748\ItemList.bin -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($cleanItemHash -ne $legacyItemHash) { throw "ItemList migration/rebuild mismatch: legacy=$legacyItemHash clean=$cleanItemHash" }

          python -c "import pathlib,subprocess; pathlib.Path(r'client748/mesh/MeshTextureList.bin').write_bytes(subprocess.check_output(['git','show','cb4b43af4587ef3b8538a73221311598495a54dd:client748/mesh/MeshTextureList.bin']))"
          & .\client748\Patch-WYD748-CostumeTextures.ps1 -MeshTextureList .\client748\mesh\MeshTextureList.bin
          $cleanTextureHash = (Get-FileHash .\client748\mesh\MeshTextureList.bin -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($cleanTextureHash -ne $legacyTextureHash) { Write-Host "MeshTextureList canonical rebuild differs from legacy slot-preserving migration as expected: legacy=$legacyTextureHash clean=$cleanTextureHash" }

          "KR_ITEM_HASH=$cleanItemHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KR_TEXTURE_HASH=$cleanTextureHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rebuild animation tables through field-wise ValidIndex translation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import pathlib,subprocess; pathlib.Path(r'client748/AniSound4.txt').write_bytes(subprocess.check_output(['git','show','cb4b43af4587ef3b8538a73221311598495a54dd:client748/AniSound4.txt']))"
          python -c "import pathlib,subprocess; pathlib.Path(r'client748/mesh/BoneAni4.txt').write_bytes(subprocess.check_output(['git','show','cb4b43af4587ef3b8538a73221311598495a54dd:client748/mesh/BoneAni4.txt']))"
          python -c "import pathlib,subprocess; pathlib.Path(r'client748/mesh/ValidIndex.bin').write_bytes(subprocess.check_output(['git','show','cb4b43af4587ef3b8538a73221311598495a54dd:client748/mesh/ValidIndex.bin']))"
          & .\client748\Patch-WYD748-KRMountAssets.ps1 -ClientRoot .\client748

      - name: Rebuild WYD.exe from the untouched 7.48 original
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item .\client748\WYD.original.exe .\client748\WYD.exe -Force
          & .\client748\Patch-WYD748.ps1 -Executable .\client748\WYD.exe
          & .\client748\Patch-WYD748-ExtendedStats.ps1 -Executable .\client748\WYD.exe
          & .\client748\Patch-WYD748-Bypass.ps1 -Executable .\client748\WYD.exe
          & .\client748\Patch-WYD748-Macro.ps1 -Executable .\client748\WYD.exe
          & .\client748\Patch-WYD748-Lindy.ps1 -Executable .\client748\WYD.exe
          & .\client748\Patch-WYD748-Costumes.ps1 -Executable .\client748\WYD.exe
          & .\client748\Patch-WYD748-KRMounts.ps1 -Executable .\client748\WYD.exe
          $wydHash = (Get-FileHash .\client748\WYD.exe -Algorithm SHA256).Hash.ToUpperInvariant()
          "KR_WYD_HASH=$wydHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "New WYD.exe SHA-256: $wydHash"

      - name: Freeze generated hashes in the reproducible chain
        shell: pwsh
        run: |
          python (Join-Path $env:RUNNER_TEMP 'kr_mount_native_fix.py') finalize --wyd-hash "$env:KR_WYD_HASH" --item-hash "$env:KR_ITEM_HASH"

      - name: Client static validation
        shell: pwsh
        working-directory: client748
        run: |
          $ErrorActionPreference = 'Stop'
          .\Apply-WYD748.ps1 -VerifyOnly
          .\Test-WYD748-Costumes.ps1
          .\Test-WYD748-KRMounts.ps1

      - name: Repository validation gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          go vet ./...
          New-Item -ItemType Directory -Path tmp -Force | Out-Null
          go build -o tmp/tm-check.exe ./cmd/server
          git diff --check
          Remove-Item tmp/tm-check.exe -ErrorAction SilentlyContinue

      - name: Confirm correction scope and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $forbidden = @(git diff --name-only | Where-Object { $_ -like 'client748/Costumes-KR.json' -or $_ -like 'client748/Patch-WYD748-Costumes.ps1' })
          if ($forbidden.Count -ne 0) { throw "costume pipeline changed unexpectedly: $($forbidden -join ', ')" }
          git status --short
          git rm -f .github/workflows/kr-mount-native-fix.yml .github/workflows/kr-mount-native-fix-fast.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align KR mounts with native client'
          git push origin HEAD:agent/fix-kr-mount-native
