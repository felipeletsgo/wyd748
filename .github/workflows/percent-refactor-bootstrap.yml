name: percentage-refactor-bootstrap

on:
  push:
    branches:
      - agent/percent-roll-audit

permissions:
  contents: write

jobs:
  refactor:
    if: "${{ github.event.head_commit.message == 'chore: run percentage refactor bootstrap' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/percent-roll-audit

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Apply refactor
        run: |
          python3 tools/percent_refactor.py
          python3 tools/percent_refactor_tests.py

      - name: Format changed Go files
        run: >-
          gofmt -w
          internal/game/percent_roll.go
          internal/game/percent_roll_test.go
          internal/game/crafting.go
          internal/game/crafting_simple.go
          internal/game/crafting_advanced.go
          internal/game/consumables.go
          internal/game/indexed_use_items.go
          internal/game/mount.go
          internal/game/celestial_native_progression_test.go
          internal/game/crafting_test.go
          internal/game/consumables_test.go
          internal/game/volatile_actions_test.go

      - name: Show remaining 100-value RNG sites
        run: |
          grep -R -n -E 'rand\.Intn\(100\)|\.intn\(100\)' internal/game || true

      - name: Test
        run: |
          set +e
          set -o pipefail
          go test ./... 2>&1 | tee /tmp/percent-refactor-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/percent-refactor-test.log').read_text(errors='replace').splitlines()
          hit = set()
          for i, line in enumerate(lines):
              if ('--- FAIL:' in line or line.startswith('FAIL') or 'panic:' in line or 'fatal error:' in line):
                  hit.update(range(max(0, i-8), min(len(lines), i+9)))
          selected = [lines[i] for i in sorted(hit)]
          if not selected:
              selected = lines[-200:]
          text = '\n'.join(selected[-300:]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=go test failed::{text}')
          PY
          fi
          exit "$status"

      - name: Vet
        run: go vet ./...

      - name: Build server
        run: |
          mkdir -p tmp
          go build -o tmp/tm-check.exe ./cmd/server
          rm -f tmp/tm-check.exe

      - name: Diff check
        run: git diff --check

      - name: Commit validated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            internal/game/percent_roll.go \
            internal/game/percent_roll_test.go \
            internal/game/crafting.go \
            internal/game/crafting_simple.go \
            internal/game/crafting_advanced.go \
            internal/game/consumables.go \
            internal/game/indexed_use_items.go \
            internal/game/mount.go \
            internal/game/celestial_native_progression_test.go \
            internal/game/crafting_test.go \
            internal/game/consumables_test.go \
            internal/game/volatile_actions_test.go \
            DOCS/CRAFTING.md
          git diff --cached --check
          git commit -m 'fix: standardize economic percentage rolls'
          git push origin HEAD:agent/percent-roll-audit
