name: tmp fix Water Secret Stone rune

on:
  push:
    branches: [agent/fix-water-secret-rune]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-water-secret-rune
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply patch
        run: python3 .github/_tmp_fix_water_secret_rune.py
      - name: Format
        run: gofmt -w internal/game/crafting_advanced.go internal/game/celestial_native_progression_test.go
      - name: Focused test
        run: go test -count=1 ./internal/game -run 'TestOdinSecretStoneRecipesMatchRetailRunes|TestOdinSecretStoneCorrectSequence'
      - name: Prepare schema fixture
        run: |
          mkdir -p data/accounts
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('data/accounts/ci.json').write_text(json.dumps({'name':'ci','passwordHash':'hash','cargo':[{} for _ in range(128)]}), encoding='utf-8')
          PY
      - name: Full validation
        run: |
          set -e
          go test -count=1 ./...
          go vet ./...
          mkdir -p tmp
          go build -o tmp/tm-check.exe ./cmd/server
          git diff --check
      - name: Commit validated fix
        env:
          BRANCH: agent/fix-water-secret-rune
        run: |
          rm -f data/accounts/ci.json tmp/tm-check.exe
          rmdir data/accounts 2>/dev/null || true
          rm -f .github/_tmp_fix_water_secret_rune.py .github/workflows/_tmp-fix-water-secret-rune.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/game/crafting_advanced.go internal/game/celestial_native_progression_test.go
          git add -u .github
          git commit -m 'fix: correct Water Secret Stone rune sequence'
          git push origin HEAD:$BRANCH
