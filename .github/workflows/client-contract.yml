name: Client contract validation

on:
  push:
    branches: [main]
    paths:
      - clientgo748/assets/**
      - clientgo748/internal/assets/**
      - clientgo748/internal/login/**
      - clientgo748/internal/protocol/**
      - clientgo748/references/assets/**
      - clientgo748/tools/assets/**
      - clientgo748/tools/Manifest-Policy.ps1
      - clientgo748/tools/Test-Manifest.ps1
      - clientgo748/Verify-Contract.ps1
  pull_request:
    paths:
      - clientgo748/assets/**
      - clientgo748/internal/assets/**
      - clientgo748/internal/login/**
      - clientgo748/internal/protocol/**
      - clientgo748/references/assets/**
      - clientgo748/tools/assets/**
      - clientgo748/tools/Manifest-Policy.ps1
      - clientgo748/tools/Test-Manifest.ps1
      - clientgo748/Verify-Contract.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Protocol and asset contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify client contracts
        working-directory: clientgo748
        run: pwsh -NoProfile -File ./Verify-Contract.ps1
