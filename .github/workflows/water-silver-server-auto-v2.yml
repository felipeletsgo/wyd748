name: Water Silver server migration v2

on:
  push:
    branches:
      - agent/water-silver-server-auto

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/water-silver-server-auto
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run guarded source migration
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          path = Path('client748/Apply-WYD748.ps1')
          text = path.read_text(encoding='utf-8')
          pattern = r'    # ETAPA 5 — constante 4010 -> 3448 da receita nativa da Lindy\.\n.*?\n\)'
          match = re.search(pattern, text, flags=re.S)
          if not match:
              raise SystemExit('Apply-WYD748.ps1: tail 5/6 not found for normalization')
          lines = match.group(0).splitlines()
          normalized = [lines[0]]
          for line in lines[1:]:
              normalized.append(line[4:] if line.startswith('    ') else line)
          text = text[:match.start()] + '\n'.join(normalized) + text[match.end():]
          path.write_text(text, encoding='utf-8', newline='\n')
          '@ | Set-Content -LiteralPath .tmp-normalize.py -Encoding utf8
          python .tmp-normalize.py
          Remove-Item .tmp-normalize.py -Force

          $workflow = Get-Content -LiteralPath .github/workflows/water-silver-server-auto.yml -Raw
          $startToken = "@'`n"
          $endToken = "'@ | Set-Content -LiteralPath .tmp-water-auto.py -Encoding utf8"
          $start = $workflow.IndexOf($startToken)
          if ($start -lt 0) { throw 'Python migration start not found in v1 workflow.' }
          $start += $startToken.Length
          $end = $workflow.IndexOf($endToken, $start)
          if ($end -lt 0) { throw 'Python migration end not found in v1 workflow.' }
          $python = $workflow.Substring($start, $end - $start)
          Set-Content -LiteralPath .tmp-water-auto.py -Value $python -Encoding utf8
          python .tmp-water-auto.py
          Remove-Item .tmp-water-auto.py -Force

      - name: Format Go
        shell: pwsh
        run: |
          gofmt -w internal/game/water_auto.go internal/game/water_auto_test.go internal/game/item_instances.go internal/game/consumables.go

      - name: Rebuild client without WaterMacro
        shell: pwsh
        run: |
          Push-Location client748
          .\Apply-WYD748.ps1
          .\Apply-WYD748.ps1 -VerifyOnly
          $hash = (Get-FileHash -LiteralPath .\WYD.exe -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($hash -ne '9762B1AC6EFB4AB3C800877DE1DA048DD43EA407FCEEA945C755DF6986607F18') {
            throw "WYD.exe final inesperado: $hash"
          }
          Pop-Location

      - name: Validate Go server
        shell: pwsh
        run: |
          go test -count=1 ./...
          go vet ./...
          New-Item -ItemType Directory -Force tmp | Out-Null
          go build -o tmp/tm-check.exe ./cmd/server
          git diff --check
          Remove-Item tmp/tm-check.exe -Force -ErrorAction SilentlyContinue

      - name: Ensure executable WaterMacro implementation is gone
        shell: pwsh
        run: |
          $hits = git grep -n -E 'macropergao|Patch-WYD748-WaterMacro|Test-WYD748-WaterMacro|tools/watermacrotable' -- ':!DOCS/WATER.md' ':!client748/PATCHES.md' ':!.github/workflows/*'
          if ($LASTEXITCODE -eq 0 -and $hits) {
            $hits | Out-Host
            throw 'Referencias executaveis do WaterMacro ainda existem.'
          }

      - name: Commit validated migration
        shell: pwsh
        run: |
          Remove-Item .github/workflows/water-silver-server-auto.yml -Force
          Remove-Item .github/workflows/water-silver-server-auto-v2.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: move Water auto-advance to Silver Angel server-side'
          git push origin HEAD:agent/water-silver-server-auto
