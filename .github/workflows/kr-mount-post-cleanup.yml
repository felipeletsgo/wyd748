name: KR mount post-cleanup validation

on:
  push:
    branches: [agent/fix-kr-mount-native]
    paths: [.github/workflows/kr-mount-post-cleanup.yml]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Reject generated artifacts
        shell: pwsh
        run: |
          if (Test-Path 'client748/mesh/KK01bon') { throw 'generated KK01bon is present' }
          if (Test-Path 'client748/mesh/MeshTextureList.pre-costumes-kr.bin') { throw 'generated MeshTextureList backup is present' }
      - name: Validate client chain
        shell: pwsh
        working-directory: client748
        run: |
          $ErrorActionPreference = 'Stop'
          .\Apply-WYD748.ps1 -VerifyOnly
          .\Test-WYD748-Costumes.ps1
          .\Test-WYD748-KRMounts.ps1
      - name: Validate repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          go vet ./...
          New-Item -ItemType Directory -Path tmp -Force | Out-Null
          go build -o tmp/tm-check.exe ./cmd/server
          Remove-Item tmp/tm-check.exe -ErrorAction SilentlyContinue
          git diff --check
      - name: Remove temporary workflow
        shell: pwsh
        run: |
          git rm .github/workflows/kr-mount-post-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove KR mount validation workflow'
          git push origin HEAD:agent/fix-kr-mount-native
