name: Fairy catalog fix

on:
  push:
    branches: ["agent/silver-itemlist-timer"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/silver-itemlist-timer
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply patch
        run: python3 tools/apply_fairy_catalog_fix.py
      - name: Format
        run: gofmt -w internal/data/catalog_test.go internal/game/fairies.go internal/game/fairies_test.go internal/game/water_auto_test.go
      - name: Focused tests
        run: go test -count=1 ./internal/data ./internal/game
      - name: Full tests
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: mkdir -p tmp && go build -o tmp/tm-check ./cmd/server
      - name: Diff check
        run: git diff --check
      - name: Commit validated fix
        run: |
          rm -f tmp/tm-check
          git rm .github/workflows/fairy-catalog-fix.yml tools/apply_fairy_catalog_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/itemlist.csv internal/data/catalog_test.go internal/game/fairies.go internal/game/fairies_test.go internal/game/water_auto_test.go
          git commit -m "fix: configure all fairy durations"
          git push origin HEAD:agent/silver-itemlist-timer
