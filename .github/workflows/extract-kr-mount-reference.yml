name: Extract KR mount reference

on:
  push:
    branches:
      - agent/kr-mount-fix
    paths:
      - .github/workflows/extract-kr-mount-reference.yml

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pointers only
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch only mount reference LFS objects
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs fetch origin HEAD --include="CLIENTS/WYD/ItemList.bin,CLIENTS/WYD/MountDataV.bin"
          git lfs checkout CLIENTS/WYD/ItemList.bin CLIENTS/WYD/MountDataV.bin

      - name: Verify reference identities
        shell: bash
        run: |
          set -euo pipefail
          stat -c '%n %s' CLIENTS/WYD/ItemList.bin CLIENTS/WYD/MountDataV.bin
          sha256sum CLIENTS/WYD/ItemList.bin CLIENTS/WYD/MountDataV.bin
          test "$(stat -c%s CLIENTS/WYD/ItemList.bin)" = "2494004"
          test "$(stat -c%s CLIENTS/WYD/MountDataV.bin)" = "14004"

      - name: Upload mount reference
        uses: actions/upload-artifact@v4
        with:
          name: kr-mount-reference
          if-no-files-found: error
          retention-days: 1
          path: |
            CLIENTS/WYD/ItemList.bin
            CLIENTS/WYD/MountDataV.bin
