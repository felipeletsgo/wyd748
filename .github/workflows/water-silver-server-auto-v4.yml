name: Water Silver server migration v4

on:
  push:
    branches:
      - agent/water-silver-server-auto

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/water-silver-server-auto
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Apply guarded migration and fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import re

          # Normalize only the existing Apply-WYD748 tail so the guarded v1
          # migration can match it exactly.
          apply = Path('client748/Apply-WYD748.ps1')
          text = apply.read_text(encoding='utf-8')
          pattern = r'    # ETAPA 5 — constante 4010 -> 3448 da receita nativa da Lindy\.\n.*?\n\)'
          m = re.search(pattern, text, flags=re.S)
          if not m:
              raise SystemExit('Apply-WYD748.ps1: tail 5/6 not found')
          lines = m.group(0).splitlines()
          normalized = [lines[0]] + [line[4:] if line.startswith('    ') else line for line in lines[1:]]
          apply.write_text(text[:m.start()] + '\n'.join(normalized) + text[m.end():], encoding='utf-8', newline='\n')

          # Reuse the complete guarded feature migration embedded in v1.
          wf = Path('.github/workflows/water-silver-server-auto.yml').read_text(encoding='utf-8')
          m = re.search(r"@'\r?\n(.*?)\r?\n\s*'@ \| Set-Content -LiteralPath \.tmp-water-auto\.py -Encoding utf8", wf, flags=re.S)
          if not m:
              raise SystemExit('embedded migration script not found')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines()) + '\n'
          Path('.tmp-water-auto.py').write_text(script, encoding='utf-8', newline='\n')
          '@ | Set-Content -LiteralPath .tmp-run-migration.py -Encoding utf8
          python .tmp-run-migration.py
          if ($LASTEXITCODE -ne 0) { throw 'migration bootstrap failed' }
          Remove-Item .tmp-run-migration.py -Force
          python .tmp-water-auto.py
          if ($LASTEXITCODE -ne 0) { throw 'feature migration failed' }
          Remove-Item .tmp-water-auto.py -Force

          @'
          from pathlib import Path
          import re

          # Make the second-commit rollback test fail the second Water transaction
          # after the first room is already open: call 1 persists the granted
          # scroll; call 2 is the next-room transition and must roll back.
          p = Path('internal/game/water_auto_test.go')
          text = p.read_text(encoding='utf-8')
          pattern = r'''type failWaterTransitionStore struct \{.*?\n\}\n\nfunc TestWaterSilverTransitionFailureLeavesExactGrantedScroll\(t \*testing\.T\) \{.*?\n\}\n'''
          replacement = r'''type failWaterTransitionStore struct {
          	guildFlowStore
          	calls  int
          	failOn int
          	failed bool
          }

          func (s *failWaterTransitionStore) SaveGameStateWithInstanceState(g *model.GuildRegistry,
          	snapshot *model.InstanceStateSnapshot, accounts ...*model.Account) error {
          	s.calls++
          	if s.calls == s.failOn && !s.failed {
          		s.failed = true
          		return errors.New("next room commit failed")
          	}
          	return s.guildFlowStore.SaveGameStateWithInstanceState(g, snapshot, accounts...)
          }

          func TestWaterSilverTransitionFailureLeavesExactGrantedScroll(t *testing.T) {
          	w, leader, _, baseStore, clock := instanceTestWorld()
          	configureWaterSecondRoom(w)
          	equipActiveSilverForWaterTest(t, w, leader)
          	older, err := materializeItem(model.Item{Index: 3174})
          	if err != nil {
          		t.Fatal(err)
          	}
          	leader.Char.Inv[5] = older

          	// Open room 1 with the normal store. From this point on the first
          	// transaction is the durable reward and the second is auto-advance.
          	w.onUseItem(leader.Session, useItemPacket(0, 0))
          	first := w.itemInstances["water-normal-1"]
          	if first == nil {
          		t.Fatal("primeira sala nao abriu")
          	}
          	failing := &failWaterTransitionStore{guildFlowStore: *baseStore, failOn: 2}
          	w.store = failing
          	killOnlyInstanceMob(t, w, first, clock.Now())

          	if !failing.failed {
          		t.Fatal("segunda fronteira de persistencia nao foi exercitada")
          	}
          	if w.itemInstances["water-normal-2"] != nil {
          		t.Fatal("sala seguinte foi publicada apesar da falha de persistencia")
          	}
          	granted := leader.Char.Inv[0]
          	if granted.Index != 3174 || granted.UID == "" || granted.UID == older.UID {
          		t.Fatalf("scroll recem concedido nao sobreviveu ao rollback: granted=%+v older=%+v",
          			granted, older)
          	}
          	if leader.Char.Inv[5].UID != older.UID {
          		t.Fatal("rollback alterou o scroll antigo do mesmo indice")
          	}
          }
          '''.replace('          ', '')
          new, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'water_auto_test rollback block: expected 1 match, got {n}')
          p.write_text(new, encoding='utf-8', newline='\n')

          # Replace stale executable WaterMacro documentation with the delivered
          # server-side Silver behavior; keep the following Warrior Seal section.
          p = Path('DOCS/IMPLEMENTATION_STATUS.md')
          text = p.read_text(encoding='utf-8')
          pattern = r'### Water — cadeia corrigida e macro \(2026-08-08\)\n\n.*?(?=- O `Warrior\x27s_Seal`)'
          replacement = '''### Water — cadeia server-side com Silver Angel (2026-08-09)

          - Cada sala e boss continua como `VolatileInstance` independente, com
            `RuntimeID` proprio, exit grace de dez segundos e persistencia
            atomica de conta + estado da instancia.
          - Rooms que concedem o proximo pergaminho materializam primeiro um UID
            server-side, persistem o grant e so entao publicam o item ao lider.
          - Se o lider estiver com Silver Angel (3914) ativa em `Equip[13]` no
            momento do reward, o servidor usa exclusivamente o UID recem-criado
            pela mesma rotina de dominio do clique manual e persiste a sala
            seguinte antes de teleporte/spawn.
          - Fada no inventario, fada de outro membro, equip posterior ao reward,
            Carry cheio com drop no chao e reward zero nao disparam automacao.
            Falha do segundo commit restaura a transicao e conserva o scroll ja
            duravel no Carry.
          - O WaterMacro client-side e os comandos `/macropergaon` e
            `/macropergaoff` foram removidos. O client suportado termina no patch
            Lindy; `Patch-WYD748-Macro.ps1` continua sendo apenas o macro normal
            de skills/buffs.
          - A cobertura especifica fica em `internal/game/water_auto_test.go`,
            incluindo UID duplicado do mesmo indice e rollback das duas fronteiras
            de persistencia.
          '''.replace('          ', '')
          new, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'IMPLEMENTATION_STATUS Water section: expected 1 match, got {n}')
          p.write_text(new, encoding='utf-8', newline='\n')
          '@ | Set-Content -LiteralPath .tmp-fix.py -Encoding utf8
          python .tmp-fix.py
          if ($LASTEXITCODE -ne 0) { throw 'post-migration fixes failed' }
          Remove-Item .tmp-fix.py -Force

      - name: Format Go
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gofmt -w internal/game/water_auto.go internal/game/water_auto_test.go internal/game/item_instances.go internal/game/consumables.go
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed' }

      - name: Rebuild client without WaterMacro
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location client748
          .\Apply-WYD748.ps1
          .\Apply-WYD748.ps1 -VerifyOnly
          $hash = (Get-FileHash -LiteralPath .\WYD.exe -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($hash -ne '9762B1AC6EFB4AB3C800877DE1DA048DD43EA407FCEEA945C755DF6986607F18') {
            throw "WYD.exe final inesperado: $hash"
          }
          Pop-Location

      - name: Validate focused Water and fairy tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=1 ./internal/game -run 'Test(Water|Fairy)'
          if ($LASTEXITCODE -ne 0) { throw 'focused Water/Fairy tests failed' }

      - name: Validate full Go server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The repository intentionally does not version production account JSON,
          # while TestProjectAccountsUseCurrentSchema requires at least one local
          # account. Create a temporary schema-valid empty account fixture only
          # for this runner, then remove it before staging changes.
          New-Item -ItemType Directory -Force data/accounts | Out-Null
          @'
          import json
          from pathlib import Path
          obj = {"name":"ci_schema","passwordHash":"ci-only","chars":[],"cargo":[{} for _ in range(128)]}
          Path('data/accounts/ci_schema.json').write_text(json.dumps(obj), encoding='utf-8')
          '@ | Set-Content -LiteralPath .tmp-account-fixture.py -Encoding utf8
          python .tmp-account-fixture.py
          if ($LASTEXITCODE -ne 0) { throw 'CI account fixture failed' }
          Remove-Item .tmp-account-fixture.py -Force

          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test ./... failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet ./... failed' }
          New-Item -ItemType Directory -Force tmp | Out-Null
          go build -o tmp/tm-check.exe ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw 'server build failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

          Remove-Item tmp/tm-check.exe -Force -ErrorAction SilentlyContinue
          Remove-Item data/accounts/ci_schema.json -Force
          if ((Get-ChildItem data/accounts -Force | Measure-Object).Count -eq 0) {
            Remove-Item data/accounts -Force
          }

      - name: Ensure executable WaterMacro implementation is gone
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hits = git grep -n -E 'macropergao|Patch-WYD748-WaterMacro|Test-WYD748-WaterMacro|tools/watermacrotable' -- ':!DOCS/WATER.md' ':!client748/PATCHES.md' ':!.github/workflows/*'
          if ($LASTEXITCODE -eq 0 -and $hits) {
            $hits | Out-Host
            throw 'Referencias executaveis do WaterMacro ainda existem.'
          }

      - name: Commit validated migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item .github/workflows/water-silver-server-auto.yml -Force
          Remove-Item .github/workflows/water-silver-server-auto-v2.yml -Force
          Remove-Item .github/workflows/water-silver-server-auto-v3.yml -Force
          Remove-Item .github/workflows/water-silver-server-auto-v4.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged diff check failed' }
          git commit -m 'feat: move Water auto-advance to Silver Angel server-side'
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:agent/water-silver-server-auto
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
