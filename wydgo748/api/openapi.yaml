      required: [version, asOf, postgresQueueDepth, persistenceFailures, panics]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time, description: Timestamp of process diagnostics, independent from the World snapshot }
        postgresQueueDepth: { type: integer, format: int64, minimum: 0 }
        persistenceFailures: { type: integer, format: int64, minimum: 0 }
        panics: { type: integer, format: int64, minimum: 0 }
    SanctionCommand:
      type: object
      additionalProperties: false
      required: [version, requestId, account, kind, durationMinutes, reason]
      description: requestId makes a retry idempotent; a different body under the same ID returns operation_conflict.
      properties:
        version: { type: integer, const: 1 }
        requestId: { type: string, minLength: 16, maxLength: 64, pattern: '^[a-zA-Z0-9-]+$' }
        account: { type: string, pattern: '^[a-z0-9]{1,12}$' }
        kind: { type: string, enum: [ban, mute] }
        durationMinutes: { type: integer, minimum: 0, maximum: 525600, description: Zero means permanent }
        reason: { type: string, minLength: 3, maxLength: 200 }
    SanctionRevokeCommand:
      type: object
      additionalProperties: false
      required: [version, account, kind, reason]
      properties:
        version: { type: integer, const: 1 }
        account: { type: string, pattern: '^[a-z0-9]{1,12}$' }
        kind: { type: string, enum: [ban, mute] }
        reason: { type: string, minLength: 3, maxLength: 200 }
    Sanction:
      type: object
      required: [id, account, kind, reason, actor, durationMinutes, createdAt, expiresAt, revokedAt, revokedBy, revokeReason, active]
      properties:
        id: { type: integer, minimum: 0 }
        account: { type: string }
        kind: { type: string, enum: [ban, mute] }
        reason: { type: string }
        actor: { type: string }
        durationMinutes: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokedBy: { type: string }
        revokeReason: { type: string }
        active: { type: boolean }
    SanctionsView:
      type: object
      required: [version, asOf, account, sanctions]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        account: { type: string }
        sanctions:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Sanction' }
    SanctionResult:
      type: object
      required: [code, replayed, live, sanction]
      properties:
        code: { type: string, enum: [ok, capability_required, operation_conflict, unknown_sanction] }
        replayed: { type: boolean }
        live: { type: string, enum: ['', applied, offline, pending] }
        sanction: { $ref: '#/components/schemas/Sanction' }
    NoticeCommand:
      type: object
      additionalProperties: false
      required: [version, operationId, message, delaySeconds, repeatCount, repeatEverySeconds]
      properties:
        version: { type: integer, const: 1 }
        operationId: { type: string, minLength: 16, maxLength: 64, pattern: '^[a-zA-Z0-9-]+$' }
        message: { type: string, minLength: 1, maxLength: 94, pattern: '^[ -~]+$', description: Printable ASCII without surrounding spaces }
        delaySeconds: { type: integer, minimum: 0, maximum: 86400 }
        repeatCount: { type: integer, minimum: 1, maximum: 100 }
        repeatEverySeconds: { type: integer, minimum: 0, maximum: 86400, description: Zero for one delivery; 60..86400 when repeatCount > 1 }
    NoticeCancelCommand:
      type: object
      additionalProperties: false
      required: [version, operationId]
      properties:
        version: { type: integer, const: 1 }
        operationId: { type: string, minLength: 16, maxLength: 64, pattern: '^[a-zA-Z0-9-]+$' }
    ScheduledNotice:
      type: object
      required: [id, message, actor, nextAt, remaining, repeatEverySeconds]
      properties:
        id: { type: integer, minimum: 1 }
        message: { type: string }
        actor: { type: string }
        nextAt: { type: string, format: date-time }
        remaining: { type: integer, minimum: 1 }
        repeatEverySeconds: { type: integer, minimum: 0 }
    NoticesView:
      type: object
      required: [version, asOf, notices]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        notices:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/ScheduledNotice' }
    NoticeResult:
      type: object
      required: [operationId, code, replayed, delivered, view]
      properties:
        operationId: { type: string }
        code: { type: string, enum: [ok, capability_required, server_maintenance, operation_conflict, operation_capacity, notice_capacity, unknown_notice] }
        replayed: { type: boolean }
        delivered: { type: integer, minimum: 0 }
        view: { $ref: '#/components/schemas/NoticesView' }
    PlayerMessageCommand:
      type: object
      additionalProperties: false
      required: [version, operationId, epoch, uid, account, expectedSessionId, message]
      properties:
        version: { type: integer, const: 1 }
        operationId: { type: string, minLength: 16, maxLength: 64, pattern: '^[a-zA-Z0-9-]+$' }
        epoch: { type: string, pattern: '^[a-f0-9]{32}$' }
        uid: { type: string, minLength: 1, maxLength: 128 }
        account: { type: string, pattern: '^[a-z0-9]{1,12}$' }
        expectedSessionId: { type: integer, minimum: 1, maximum: 9007199254740991 }
        message: { type: string, minLength: 1, maxLength: 94, pattern: '^[ -~]+$' }
    PlayerMessageResult:
      type: object
      required: [operationId, code, replayed]
      properties:
        operationId: { type: string }
        code: { type: string, enum: [ok, stale_target, capability_required, operation_conflict, operation_capacity] }
        replayed: { type: boolean }
    ShutdownCommand:
      type: object
      additionalProperties: false
      required: [version, operationId, action, mode, delaySeconds, reason]
      description: schedule requires mode and delaySeconds 60..86400; cancel requires an empty mode and zero delay.
      properties:
        version: { type: integer, const: 1 }
        operationId: { type: string, minLength: 16, maxLength: 64, pattern: '^[a-zA-Z0-9-]+$' }
        action: { type: string, enum: [schedule, cancel] }
        mode: { type: string, enum: ['', shutdown, restart] }
        delaySeconds: { type: integer, minimum: 0, maximum: 86400 }
        reason: { type: string, minLength: 3, maxLength: 200 }
    ShutdownStatus:
      type: object
      required: [version, asOf, scheduled, mode, at, secondsRemaining, actor, reason, loginsBlocked, available]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        scheduled: { type: boolean }
        mode: { type: string, enum: ['', shutdown, restart] }
        at: { type: [string, 'null'], format: date-time }
        secondsRemaining: { type: integer, minimum: 0 }
        actor: { type: string }
        reason: { type: string }
        loginsBlocked: { type: boolean }
        available: { type: boolean, description: False when this process has no shutdown hook }
    ShutdownResult:
      type: object
      required: [operationId, code, replayed, status]
      properties:
        operationId: { type: string }
        code: { type: string, enum: [ok, capability_required, server_maintenance, operation_conflict, operation_capacity, shutdown_unavailable, already_scheduled, not_scheduled, already_started] }
        replayed: { type: boolean }
        status: { $ref: '#/components/schemas/ShutdownStatus' }
    AuditEntry:
      type: object
      required: [id, at, actor, action, result, requestId, clientIp, method, path, details]
      properties:
        id: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        result: { type: string }
        requestId: { type: string }
        clientIp: { type: string }
        method: { type: string }
        path: { type: string }
        details:
          type: object
          additionalProperties: true
    AuditPage:
      type: object
      required: [version, asOf, entries, nextBefore]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        entries:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AuditEntry' }
        nextBefore: { type: integer, minimum: 0, description: Zero when there is no older page }
    MetricsPoint:
      type: object
      required: [at, players, mobs, queueDepth, loopLagP99Micros, tickP99Micros, queueAgeP99Micros, commandsPerSecond, budgetExceeded, panics, postgresQueueDepth, postgresFailures, postgresTxMicros, heapBytes, goroutines, gcCycles]
      description: P99 values are the upper bound of the fixed bucket holding the interval's 99th percentile (0 = no observation, 1000001 = above one second). Counts are per interval.
      properties:
        at: { type: string, format: date-time }
        players: { type: integer, minimum: 0 }
        mobs: { type: integer, minimum: 0 }
        queueDepth: { type: integer, minimum: 0 }
        loopLagP99Micros: { type: integer, minimum: 0 }
        tickP99Micros: { type: integer, minimum: 0 }
        queueAgeP99Micros: { type: integer, minimum: 0 }
        commandsPerSecond: { type: number, minimum: 0 }
        budgetExceeded: { type: integer, minimum: 0 }
        panics: { type: integer, minimum: 0 }
        postgresQueueDepth: { type: integer, minimum: 0 }
        postgresFailures: { type: integer, minimum: 0 }
        postgresTxMicros: { type: integer, minimum: 0 }
        heapBytes: { type: integer, minimum: 0 }
        goroutines: { type: integer, minimum: 0 }
        gcCycles: { type: integer, minimum: 0 }
    BreakerState:
      type: object
      required: [open, reason]
      properties:
        open: { type: boolean }
        reason: { type: string, enum: ['', loop_lag, command_queue_age, persistence_backlog] }
    MetricsHistory:
      type: object
      required: [version, asOf, window, intervalSeconds, points, breaker]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        window: { type: string, enum: ['15m', '1h', '6h', '24h'] }
        intervalSeconds: { type: integer, minimum: 1 }
        points:
          type: array
          maxItems: 360
          items: { $ref: '#/components/schemas/MetricsPoint' }
        breaker: { $ref: '#/components/schemas/BreakerState' }
    AccountLogin:
      type: object
      required: [at, clientIp, channel]
      properties:
        at: { type: string, format: date-time }
        clientIp: { type: string }
        channel: { type: integer, minimum: 1, maximum: 255 }
    AccountLogins:
      type: object
      required: [version, asOf, account, ipVisible, logins]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        account: { type: string }
        ipVisible: { type: boolean }
        logins:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AccountLogin' }
    AccountActions:
      type: object
      required: [version, asOf, account, entries]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        account: { type: string }
        entries:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AuditEntry' }
    StaffStoredItem:
      type: object
      required: [slot, itemId, name, effects]
      properties:
        slot: { type: integer, minimum: 0 }
        itemId: { type: integer, minimum: 1, maximum: 65535 }
        name: { type: string }
        effects:
          type: array
          minItems: 6
          maxItems: 6
          items: { type: integer, minimum: 0, maximum: 255 }
    CharacterStorage:
      type: object
      required: [version, asOf, account, uid, name, gold, cargoGold, equipment, inventory, cargo]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        account: { type: string }
        uid: { type: string }
        name: { type: string }
        gold: { type: integer, minimum: 0 }
        cargoGold: { type: integer, minimum: 0 }
        equipment: { type: array, items: { $ref: '#/components/schemas/StaffStoredItem' } }
        inventory: { type: array, items: { $ref: '#/components/schemas/StaffStoredItem' } }
        cargo: { type: array, items: { $ref: '#/components/schemas/StaffStoredItem' } }
    LogEntry:
      type: object
      required: [cursor, time, priority, message]
      properties:
        cursor: { type: string }
        time: { type: string, format: date-time }
        priority: { type: integer, minimum: 0, maximum: 7 }
        message: { type: string, maxLength: 2048 }
    LogPage:
      type: object
      required: [version, asOf, source, entries, nextCursor, truncated]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        source: { type: string, enum: [game, player, backup] }
        entries:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/LogEntry' }
        nextCursor: { type: string, description: Empty when no older entry matches }
        truncated: { type: boolean, description: The scan budget or response size ended the page early }
    BackupReceipt:
      type: [object, 'null']
      required: [at, archive]
      properties:
        at: { type: string, format: date-time }
        archive: { type: string }
        bytes: { type: integer, minimum: 0 }
        sha256: { type: string }
        restoredAccounts: { type: integer, minimum: 0 }
    BackupStatus:
      type: object
      required: [version, asOf, backup, restoreTest]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        backup: { $ref: '#/components/schemas/BackupReceipt' }
        restoreTest: { $ref: '#/components/schemas/BackupReceipt' }
    ContentHit:
      type: object
      required: [kind, key, name]
      properties:
        kind: { type: string, enum: [item, mob] }
        key: { type: string, description: Item ID or NPC template name }
        name: { type: string }
    ContentSearch:
      type: object
      required: [version, builtAt, hits]
      properties:
        version: { type: integer, const: 1 }
        builtAt: { type: string, format: date-time }
        hits: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ContentHit' } }
    ContentItem:
      type: object
      required: [id, name, soldBy, droppedBy, quests]
      properties:
        id: { type: integer }
        name: { type: string }
        soldBy:
          type: array
          items: { type: object, required: [npc, slot], properties: { npc: { type: string }, slot: { type: integer } } }
        droppedBy:
          type: array
          items:
            type: object
            required: [mob, slot, oneIn, always, baseOneIn]
            properties:
              mob: { type: string }
              slot: { type: integer }
              oneIn: { type: integer, minimum: 0, description: 'Effective rate for this monster (level band, special slots, cap) before the killer drop bonus; each kill drops the slot when rand()%oneIn==0.' }
              always: { type: boolean, description: 'The slot drops on every kill (slot 11, or an effective rate of zero).' }
              baseOneIn: { type: integer, minimum: 0, description: 'Unadjusted droprate.json slot value.' }
        quests:
          type: array
          items: { type: object, required: [id, name, role], properties: { id: { type: integer }, name: { type: string }, role: { type: string, enum: [required, consumed, reward] } } }
    ContentMobItem:
      type: object
      required: [itemId, name, slot]
      properties:
        itemId: { type: integer }
        name: { type: string }
        slot: { type: integer }
        oneIn: { type: integer, description: 'Drops only; same meaning as ContentItem droppedBy oneIn. Omitted when zero.' }
        always: { type: boolean, description: 'Drops only; the slot drops on every kill. Omitted when false.' }
        baseOneIn: { type: integer, description: 'Drops only; unadjusted droprate.json value. Omitted when zero.' }
    ContentMob:
      type: object
      required: [name, kind, level, gold, drops, sells, spawns, merchant]
      properties:
        name: { type: string }
        kind: { type: string, enum: [npc, monster] }
        level: { type: integer }
        gold: { type: integer }
        merchant: { type: boolean }
        drops: { type: array, items: { $ref: '#/components/schemas/ContentMobItem' } }
        sells: { type: array, items: { $ref: '#/components/schemas/ContentMobItem' } }
        spawns:
          type: array
          items:
            type: object
            required: [generator, enabled, role, x, y, maxMobs]
            properties:
              generator: { type: integer }
              enabled: { type: boolean }
              reserved: { type: string, enum: [item_instance, colosseum], description: 'Feature owning an enabled generator the World skips at boot; such entries never spawn in the open world.' }
              role: { type: string, enum: [leader, follower, both] }
              x: { type: integer }
              y: { type: integer }
              maxMobs: { type: integer }
    ContentIssue:
      type: object
      required: [severity, kind, subject, detail]
      properties:
        severity: { type: string, enum: [error, warning], description: error would also fail the boot for an enabled generator }
        kind: { type: string }
        subject: { type: string }
        detail: { type: string }
    ContentIssues:
      type: object
      required: [version, builtAt, issues]
      properties:
        version: { type: integer, const: 1 }
        builtAt: { type: string, format: date-time }
        issues: { type: array, items: { $ref: '#/components/schemas/ContentIssue' } }
    ZoneInfo:
      type: object
      required: [version, x, y, terrainLoaded, height, attribute, walkable, blocked, teleportActivation, newbieZone, teleports, questZones, clearAreas, instances]
      description: Only attribute bits the server relies on are named (0x02 blocked, 0x10 client teleport activation, 0x80 newbie field); attribute keeps the raw byte.
      properties:
        version: { type: integer, const: 1 }
        x: { type: integer }
        y: { type: integer }
        terrainLoaded: { type: boolean }
        height: { type: integer, minimum: -128, maximum: 127 }
        attribute: { type: integer, minimum: 0, maximum: 255 }
        walkable: { type: boolean }
        blocked: { type: boolean }
        teleportActivation: { type: boolean }
        newbieZone: { type: boolean }
        teleports:
          type: array
          items: { type: object, required: [name, destX, destY, price], properties: { name: { type: string }, destX: { type: integer }, destY: { type: integer }, price: { type: integer } } }
        questZones: { type: array, items: { type: string } }
        clearAreas: { type: array, items: { type: string } }
        instances:
          type: array
          items: { type: object, required: [id, name, x, y, areaRadius], properties: { id: { type: string }, name: { type: string }, x: { type: integer }, y: { type: integer }, areaRadius: { type: integer } } }
    MapPlayer:
      type: object
      required: [uid, name, account, level, x, y, sessionId]
      properties:
        uid: { type: string }
        name: { type: string }
        account: { type: string }
        level: { type: integer }
        x: { type: integer }
        y: { type: integer }
        sessionId: { type: integer }
    MapMob:
      type: object
      required: [id, name, x, y, hp, maxHp, boss, npc]
      properties:
        id: { type: integer }
        name: { type: string }
        x: { type: integer }
        y: { type: integer }
        hp: { type: integer }
        maxHp: { type: integer }
        boss: { type: boolean }
        npc: { type: boolean }
    MapSnapshot:
      type: object
      required: [version, asOf, x, y, radius, players, mobs, truncated]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        x: { type: integer }
        y: { type: integer }
        radius: { type: integer, minimum: 1, maximum: 128 }
        players: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/MapPlayer' } }
        mobs: { type: array, maxItems: 400, items: { $ref: '#/components/schemas/MapMob' } }
        truncated: { type: boolean }
    InstanceStatus:
      type: object
      required: [runtimeId, configId, name, x, y, areaRadius, state, stage, members, mobs, remaining, bossSpawned, rewardGranted, combatEnds, transitionAt, quizEnds, exitAt, hardDeadline, scheduleEnd, maxPlayers]
      properties:
        runtimeId: { type: string }
        configId: { type: string }
        name: { type: string }
        x: { type: integer }
        y: { type: integer }
        areaRadius: { type: integer }
        state: { type: string }
        stage: { type: integer }
        members:
          type: array
          items: { type: object, required: [name, leader], properties: { name: { type: string }, leader: { type: boolean } } }
        mobs: { type: integer }
        remaining: { type: integer }
        bossSpawned: { type: boolean }
        rewardGranted: { type: boolean }
        combatEnds: { type: [string, 'null'], format: date-time }
        transitionAt: { type: [string, 'null'], format: date-time }
        quizEnds: { type: [string, 'null'], format: date-time }
        exitAt: { type: [string, 'null'], format: date-time }
        hardDeadline: { type: [string, 'null'], format: date-time }
        scheduleEnd: { type: [string, 'null'], format: date-time }
        maxPlayers: { type: integer }
    InstancesView:
      type: object
      required: [version, asOf, instances]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        instances: { type: array, items: { $ref: '#/components/schemas/InstanceStatus' } }
    AccountNote:
      type: object
      required: [id, at, actor, body, bugRefs]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actor: { type: string }
        body: { type: string, maxLength: 2000 }
        bugRefs: { type: array, items: { type: string, pattern: '^BUG-[0-9]{3,6}$' } }
    AccountNotes:
      type: object
      required: [version, asOf, account, notes]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        account: { type: string }
        notes: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/AccountNote' } }
    AccountNoteCommand:
      type: object
      additionalProperties: false
      required: [version, body, bugRefs]
      properties:
        version: { type: integer, const: 1 }
        body: { type: string, minLength: 3, maxLength: 2000, description: 'Plain text; newlines allowed and other control characters rejected' }
        bugRefs: { type: array, maxItems: 10, uniqueItems: true, items: { type: string, pattern: '^BUG-[0-9]{3,6}$' } }
