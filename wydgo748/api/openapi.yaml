openapi: 3.1.0
info:
  title: WYD website and administrative APIs
  version: 0.14.0
paths:
  /api/player/v1/characters/{slot}/inventory:
    get:
      summary: Read this account's saved inventory, never live game state
      description: Only nonempty playable slots 0-62, from one SQL snapshot. Reserved cells and internal item identities are excluded. Quantity uses instance effect 61, except mount HP; the browser must not recompute it. No movement, trade or item mutation is available.
      security: [{ playerSession: [] }]
      parameters:
        - { name: slot, in: path, required: true, schema: { type: string, pattern: '^[0-3]$' } }
      responses:
        '200':
          description: No-store versioned saved inventory with characterSlot and capacity 63; no gold field
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerStorageResponse' }
        default: { $ref: '#/components/responses/PlayerError' }
  /api/player/v1/cargo:
    get:
      summary: Read saved Cargo belonging to the signed-in website account
      description: Only nonempty visible slots 0-119 and stored gold. Owner comes exclusively from the authenticated session. No account selector or economy mutation is available.
      security: [{ playerSession: [] }]
      responses:
        '200':
          description: No-store versioned Cargo with gold and capacity 120; no characterSlot field
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerStorageResponse' }
        default: { $ref: '#/components/responses/PlayerError' }
  /api/player/v1/characters/{slot}:
    get:
      summary: Read equipment and saved character details belonging to this website session
      description: Read-only allowlist from one persisted account snapshot. No internal identities, inventory, cargo or derived combat score. Slot is not a durable identity and selects only the current account's character. Account query parameters never select an owner.
      security: [{ playerSession: [] }]
      parameters:
        - { name: slot, in: path, required: true, schema: { type: string, pattern: '^[0-3]$' } }
      responses:
        '200':
          description: No-store persisted snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerCharacterResponse' }
        default: { $ref: '#/components/responses/PlayerError' }
  /api/player/v1/profile:
    get:
      summary: Read the signed-in account's saved projection, never another account
      security: [{ playerSession: [] }]
      responses:
        '200':
          description: No-store response; fields and timestamps come from one persisted snapshot, not the live World
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProfileResponse' }
        default: { $ref: '#/components/responses/PlayerError' }
  /api/player/v1/sessions:
    get:
      summary: List unexpired website sessions belonging to the signed-in account
      description: No IP addresses, device fingerprints, bearer cookies or CSRF tokens are returned. Game and staff sessions are excluded. A player API restart clears all sessions.
      security: [{ playerSession: [] }]
      responses:
        '200':
          description: No-store snapshot; current session first, then newest first. This request refreshes only the current session's idle timeout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerSessions' }
        default: { $ref: '#/components/responses/PlayerError' }
  /api/player/v1/sessions/revoke:
    post:
      summary: Revoke one website session of the signed-in account
      description: Rechecks account ownership under the session lock. Missing and cross-account IDs both return 404; repeated revocation does not affect another session. Revoking the current session expires its cookie.
      security: [{ playerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      responses:
        '200':
          description: Session revoked; signedOut means the current session was also revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerSessionRevocation' }
        default: { $ref: '#/components/responses/PlayerError' }
  /api/player/v1/sessions/revoke-all:
    post:
      summary: Revoke all existing website sessions of the signed-in account, including the caller
      description: Atomic under the process session lock; expires the current cookie. A subsequent successful password login can create a new session. This is not a password change, game disconnect or staff logout.
      security: [{ playerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: All existing website sessions revoked; signedOut is true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerSessionRevocation' }
        default: { $ref: '#/components/responses/PlayerError' }
  /api/v1/staff/players/{uid}/teleport:
    post:
      summary: Teleport the selected live session to a public city (moderation.player.teleport); embedded World only
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - name: uid
          in: path
          required: true
          schema: { type: string }
          description: Must equal the UID in the command body
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeleportCommand' }
      responses:
        '200':
          description: Domain receipt; retry uncertain outcomes with the identical body. No arbitrary coordinates; rejected in instances, war arenas, trade or ghost shop. Persistence failure rolls back before publication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeleportResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/players/{uid}/kick:
    post:
      summary: Disconnect the selected live session (moderation.player.kick); embedded World only
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - name: uid
          in: path
          required: true
          schema: { type: string }
          description: Must equal the UID in the command body
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KickCommand' }
      responses:
        '200':
          description: Domain receipt; retry uncertain outcomes with the identical body. Does not ban. Persistence failure is reported separately.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KickResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/events/global-drop:
    get:
      summary: Inspect process-local global drop event (game.event.global-drop capability)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Authoritative World snapshot; event is not resumed after restart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalDropStatus' }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Start or stop global drop through embedded World queue; staff session rechecked at execution
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GlobalDropCommand' }
      responses:
        '200':
          description: Domain receipt (code ok means success); retry uncertain outcomes with the identical body and operationId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalDropResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/premium-shop:
    get:
      summary: Read the premium shop catalog (economy.premium.catalog capability)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Catalog stored in PostgreSQL; available is false when the server has no premium backend
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremiumCatalog' }
        default: { $ref: '#/components/responses/Error' }
    put:
      summary: Replace the premium shop catalog; refused when expectedCatalogVersion is outdated
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PremiumCatalogCommand' }
      responses:
        '200':
          description: Domain receipt (code ok means saved; stale_catalog returns the current catalog)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremiumCatalogResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/accounts/{account}/donate:
    parameters:
      - { name: account, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]{1,12}$' } }
    get:
      summary: Read an account donate balance, pending credits and latest ledger rows (economy.donate.credit capability)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Persisted donate state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DonateAccount' }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Credit donate to an account; requestId makes retries idempotent; applied by the game server once
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonateCreditCommand' }
      responses:
        '200':
          description: Domain receipt (code ok means the credit is stored)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DonateCreditResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/events/quiz:
    get:
      summary: Inspect process-local quiz event (game.event.quiz capability)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Authoritative World snapshot; event is not resumed after restart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizStatus' }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Start or stop quiz through embedded World queue; staff session rechecked at execution
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizCommand' }
      responses:
        '200':
          description: Domain receipt (code ok means success); retry uncertain outcomes with the identical body and operationId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/bosses:
    get:
      summary: Inspect configured boss lifecycle (game.boss.summon capability)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Authoritative World snapshot of configured bosses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BossesStatus' }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Summon a configured dead boss through the embedded World queue; staff session rechecked at execution
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BossesCommand' }
      responses:
        '200':
          description: Domain receipt; retry uncertain outcomes with the identical body and operationId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BossesResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/world/pvp-door:
    get:
      summary: Inspect the Armia PvP door (game.world.pvp-door capability)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Authoritative World state of the PvP door
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PvPDoorStatus' }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Lock or open the Armia PvP door (7.59 pkgate); staff session rechecked at execution
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PvPDoorCommand' }
      responses:
        '200':
          description: Domain receipt; lock and open are idempotent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PvPDoorResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/events/ox:
    get:
      summary: Inspect the OX quiz arena (game.event.ox capability)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Authoritative World state of the OX arena
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OXEventStatus' }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Run the OX quiz arena (7.59 quizmode, quizdoor, quizresultx, quizresulto); staff session rechecked at execution
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OXEventCommand' }
      responses:
        '200':
          description: Domain receipt; mode and door actions are idempotent, results move only players still on the losing side
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OXEventResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/events/colosseum:
    get:
      summary: Inspect today's Colosseum schedule (game.event.colosseum capability)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Authoritative World state and schedule in the guild-war timezone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColosseumStatus' }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Start today's selected tier early; staff session rechecked at execution
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColosseumCommand' }
      responses:
        '200':
          description: Process-local receipt; the early run replaces today's scheduled tier until restart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColosseumResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/session:
    get:
      summary: Get session and CSRF token; create an anonymous session if absent
      responses:
        '200':
          description: Current session; never a bearer credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      summary: Rotate session after game password, staff allowlist and configured administrative PIN verification
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, adminPin, turnstileToken]
              properties:
                username: { type: string, minLength: 1, maxLength: 12 }
                password: { type: string, minLength: 1, maxLength: 10, writeOnly: true }
                adminPin: { type: string, minLength: 6, maxLength: 6, pattern: '^[0-9]{6}$', writeOnly: true }
                turnstileToken: { type: string, minLength: 1, maxLength: 2048, writeOnly: true, description: Single-use Turnstile token bound to the staff_login action. }
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Session invalidated, cookie expired
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: signed_out }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/accounts:
    post:
      summary: Create a client-compatible player account; requires the configured administrative PIN
      description: Published panels require an authenticated staff session. PIN-only bootstrap is limited to explicit local HTTP development. New passwords require 8 to 10 characters. Creation grants no staff authorization and creates no character.
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreateRequest' }
      responses:
        '201':
          description: Account created with an empty character list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCreateResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/overview:
    get:
      summary: One fresh World snapshot; requires both read capabilities
      security: [{ staffSession: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 48 }
          description: Case-insensitive name, account or UID substring; maximum 48 Unicode characters
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - { in: query, name: minLevel, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { in: query, name: maxLevel, schema: { type: integer, minimum: 1, maximum: 1000 }, description: Must not be below minLevel }
        - { in: query, name: class, schema: { type: integer, minimum: 0, maximum: 255 } }
        - { in: query, name: guild, schema: { type: integer, minimum: 1, maximum: 65535 } }
        - { in: query, name: x, schema: { type: integer, minimum: 0, maximum: 4095 }, description: Area center; requires y and radius }
        - { in: query, name: y, schema: { type: integer, minimum: 0, maximum: 4095 } }
        - { in: query, name: radius, schema: { type: integer, minimum: 1, maximum: 256 }, description: Chebyshev distance in cells from x/y }
      responses:
        '200':
          description: Snapshot sorted by UID, maximum 50 players; pages are not a stable cursor. Filters run in the same World pass as search; online stays the unfiltered count. Search, filters and offset above zero are optional reads, refused with 503 temporarily_unavailable while the panel circuit breaker is open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/metrics:
    get:
      summary: Runtime history from the in-process sampler (server.status); never queries the World
      security: [{ staffSession: [] }]
      parameters:
        - { in: query, name: window, schema: { type: string, enum: ['15m', '1h', '6h', '24h'], default: '1h' } }
      responses:
        '200':
          description: 10-second points, oldest first, merged into at most 360 points; includes the circuit breaker state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsHistory' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/accounts:
    get:
      summary: Search the persistent account directory with character summaries and optional live presence
      description: Requires moderation.player.search. The PostgreSQL projection excludes password hashes, raw account payloads, inventory and cargo.
      security: [{ staffSession: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 12, pattern: '^[a-zA-Z0-9]*$' }
          description: Case-insensitive account or character-name prefix
        - in: query
          name: cursor
          schema: { type: string, maxLength: 12, pattern: '^[a-z0-9]*$' }
          description: Opaque account key returned as nextCursor; omit on the first page
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Keyset-paginated persistent accounts; online is meaningful only when presenceAvailable is true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDirectory' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/players/{uid}/persistent:
    get:
      summary: Read one persisted character projection from PostgreSQL
      security: [{ staffSession: [] }]
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
          description: Canonical persistent character UID from the live snapshot
        - in: query
          name: account
          required: true
          schema: { type: string, minLength: 1, maxLength: 12 }
          description: Account owning the character in the live snapshot
      responses:
        '200':
          description: Independent PostgreSQL read; asOf is not the World snapshot timestamp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersistentPlayer' }
        default: { $ref: '#/components/responses/Error' }
  /api/player/v1/guilds/{name}:
    get:
      summary: Read the saved public guild profile
      description: Anonymous, no-store. Names are case-insensitive. One bounded canonical registry projection is cached for at most one minute and coalesced across visitors. Accounts, join dates, private war state and internal IDs are not returned. No live World queries or guild mutations.
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string, minLength: 1, maxLength: 12, pattern: '^[A-Za-z0-9](?:[A-Za-z0-9 ]{0,10}[A-Za-z0-9])?$' }
      responses:
        '200':
          description: Saved canonical guild with public members and roles
          content:
            application/json:
              schema:
                type: object
                required: [version, guild, asOf, source]
                properties:
                  version: { type: integer, const: 1 }
                  guild: { $ref: '#/components/schemas/PublicGuildProfile' }
                  asOf: { type: string, format: date-time, description: Saved guild_state.updated_at, not a live timestamp }
                  source: { type: string, const: persisted snapshot }
        default: { $ref: '#/components/responses/PlayerError' }
  /api/player/v1/guild:
    get:
      summary: Read the signed-in account's guild for management
      description: Resolves the guild through the account's characters in the saved guild projection, preferring the leader character. Only the leader may change the guild mark.
      security: [{ playerSession: [] }]
      responses:
        '200':
          description: The account's guild, role and current guild mark
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerGuildManagement' }
        default: { $ref: '#/components/responses/PlayerError' }
  /api/player/v1/guild/mark:
    post:
      summary: Upload the guild mark (guild leader only)
      description: A ready-to-use 16x12, 24-bit BMP of 630 or 632 bytes is stored unchanged; a PNG, JPEG, GIF or uncompressed BMP up to 64 KB is converted to it. The 7.48 client downloads it from /patch/guildmark/b<group><channel><guild>.bmp.
      security: [{ playerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image]
              properties:
                image: { type: string, description: Base64 image bytes }
      responses:
        '200':
          description: Stored guild mark
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerGuildMarkResult' }
        default: { $ref: '#/components/responses/PlayerError' }
  /api/player/v1/guild/mark/delete:
    post:
      summary: Remove the guild mark (guild leader only)
      security: [{ playerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Guild mark removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerGuildMarkResult' }
        default: { $ref: '#/components/responses/PlayerError' }
  /api/v1/staff/accounts/{account}/sanctions:
    get:
      summary: List an account's sanction history (moderation.account.ban or moderation.account.mute)
      security: [{ staffSession: [] }]
      parameters:
        - name: account
          in: path
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9]{1,12}$' }
      responses:
        '200':
          description: Newest 50 sanctions from PostgreSQL; active is computed at read time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionsView' }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Ban the account or mute its chat; the capability follows the kind
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - name: account
          in: path
          required: true
          schema: { type: string }
          description: Must equal the canonical account in the command body
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionCommand' }
      responses:
        '200':
          description: The row is durable before any live effect. A ban disconnects online sessions and blocks login; live=pending means the World did not confirm and the row still governs the next login.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/accounts/{account}/sanctions/{id}/revoke:
    post:
      summary: Lift one sanction before it expires; the capability follows the kind
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - name: account
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRevokeCommand' }
      responses:
        '200':
          description: replayed=true when it was already revoked; the live state is refreshed either way
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/notices:
    get:
      summary: List scheduled staff notices (server.notice); process-local, cleared on restart
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Pending notices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticesView' }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Broadcast a notice now or later, optionally repeated (server.notice)
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoticeCommand' }
      responses:
        '200':
          description: Process-local receipt; uses the native top notice and a [Staff] chat line
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/notices/{id}/cancel:
    post:
      summary: Cancel a scheduled notice (server.notice)
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoticeCancelCommand' }
      responses:
        '200':
          description: Process-local receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/players/{uid}/message:
    post:
      summary: Send a staff message to the selected live session (server.notice)
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - name: uid
          in: path
          required: true
          schema: { type: string }
          description: Must equal the UID in the command body
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerMessageCommand' }
      responses:
        '200':
          description: Domain receipt bound to the Overview moderationEpoch and session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerMessageResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/server/shutdown:
    get:
      summary: Inspect the scheduled maintenance shutdown (server.shutdown)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Process-local countdown state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShutdownStatus' }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Schedule or cancel a maintenance shutdown or restart (server.shutdown)
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShutdownCommand' }
      responses:
        '200':
          description: Countdown notices at 60, 30, 15, 10, 5, 3, 2 and 1 minutes and 30 and 10 seconds; logins close in the final minute. At zero the process persists state like SIGTERM and exits 0 (shutdown) or 75 (restart, for a supervisor with Restart=on-failure).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShutdownResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/audit:
    get:
      summary: Page the persisted staff audit history newest first (staff.audit.read)
      security: [{ staffSession: [] }]
      parameters:
        - { name: actor, in: query, schema: { type: string, pattern: '^[a-zA-Z0-9]{0,12}$' } }
        - { name: action, in: query, schema: { type: string, pattern: '^[a-z0-9._-]{0,64}$' } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 }, description: nextBefore from the previous page }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Keyset page; credentials and PINs are never recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/accounts/{account}/logins:
    get:
      summary: Newest 50 admitted game logins of the account (moderation.player.search); 90-day retention
      security: [{ staffSession: [] }]
      parameters:
        - { name: account, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9]{1,12}$' } }
      responses:
        '200':
          description: clientIp is empty unless the staff entry holds moderation.account.ip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountLogins' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/accounts/{account}/actions:
    get:
      summary: Newest 50 persisted staff actions naming the account as target (staff.audit.read)
      security: [{ staffSession: [] }]
      parameters:
        - { name: account, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9]{1,12}$' } }
      responses:
        '200':
          description: Entries from staff_audit whose details target the account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountActions' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/players/{uid}/storage:
    get:
      summary: Saved equipment, carry inventory and account Cargo of one character, read-only (moderation.player.search)
      security: [{ staffSession: [] }]
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: account, in: query, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9]{1,12}$' } }
      responses:
        '200':
          description: Persisted snapshot; live state may differ until the next save. Occupied cells only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterStorage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/logs:
    get:
      summary: Allowlisted server logs through the wyd-log-reader helper (operations.logs.read)
      security: [{ staffSession: [] }]
      parameters:
        - { name: source, in: query, required: true, schema: { type: string, enum: [game, player, backup] } }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: Default one hour before now }
        - { name: until, in: query, schema: { type: string, format: date-time }, description: Default now; window at most 7 days }
        - { name: priority, in: query, schema: { type: integer, minimum: 0, maximum: 7, default: 6 }, description: Journal maximum level (0 emerg to 7 debug) }
        - { name: query, in: query, schema: { type: string, maxLength: 80 }, description: Case-insensitive substring; never passed to a shell }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 }, description: nextCursor of the previous page }
      responses:
        '200':
          description: Newest first; messages are plain text with escapes and control characters removed. Reads are audited without content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogPage' }
        '410':
          description: The cursor no longer exists in the journal; restart from the newest entries
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/backups:
    get:
      summary: Latest backup and restore-test receipts through the wyd-log-reader helper (operations.logs.read)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: A null receipt means none was recorded. Dumps are never downloadable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/content/search:
    get:
      summary: Search items and monsters by name in the staff content index (server.status)
      security: [{ staffSession: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 48 } }
      responses:
        '200':
          description: Static index built at server start
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentSearch' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/content/items/{id}:
    get:
      summary: Where an item is sold, dropped and used by quests (server.status)
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 65535 } }
      responses:
        '200':
          description: Static index built at server start
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/content/mobs/{name}:
    get:
      summary: Drops, sales and spawn generators of one NPC template (server.status)
      security: [{ staffSession: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: Static index built at server start
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentMob' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/content/issues:
    get:
      summary: Unresolved references in the loaded game data (server.status)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Static index built at server start
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentIssues' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/world/zone:
    get:
      summary: 'Static rules at one cell: terrain attributes, portals, quest zones and instance areas (server.status)'
      security: [{ staffSession: [] }]
      parameters:
        - { name: x, in: query, required: true, schema: { type: integer, minimum: 0, maximum: 4095 } }
        - { name: y, in: query, required: true, schema: { type: integer, minimum: 0, maximum: 4095 } }
      responses:
        '200':
          description: Static index built at server start
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneInfo' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/world/terrain:
    get:
      summary: Attribute map rendered once as a 1024x1024 PNG, one pixel per 4x4 cells (server.status)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Dark blocked, height-shaded walkable, amber teleport attribute, blue newbie field
          content:
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/world/map:
    get:
      summary: Live players and monsters in a square around a cell (moderation.player.search)
      security: [{ staffSession: [] }]
      parameters:
        - { name: x, in: query, required: true, schema: { type: integer, minimum: 0, maximum: 4095 } }
        - { name: y, in: query, required: true, schema: { type: integer, minimum: 0, maximum: 4095 } }
        - { name: radius, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 128 } }
      responses:
        '200':
          description: Bounded World read (200 players, 400 monsters) through the overview gate; optional read refused while the circuit breaker is open; 12 reads a minute per staff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapSnapshot' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/world/instances:
    get:
      summary: Active item instances with members, stage and deadlines (server.status)
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Bounded World read through the overview gate; optional read refused while the circuit breaker is open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstancesView' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/staff/accounts/{account}/notes:
    get:
      summary: Newest 50 append-only case notes of the account (moderation.player.search)
      security: [{ staffSession: [] }]
      parameters:
        - { name: account, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9]{1,12}$' } }
      responses:
        '200':
          description: Notes newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountNotes' }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Append a case note (moderation.account.ban or moderation.account.mute)
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - { name: account, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9]{1,12}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountNoteCommand' }
      responses:
        '200':
          description: The stored note; the audit records its ID and length, not its text
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountNote' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    playerSession:
      type: apiKey
      in: cookie
      name: __Host-wyd_player
      description: HttpOnly Secure SameSite=Strict; 8-hour absolute and 30-minute idle lifetime. Local development uses wyd_player_local without Secure. Mutations require the exact Origin, JSON and session CSRF token.
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-wyd_session
      description: HttpOnly Secure SameSite=Lax. Local dev uses wyd_local_session without Secure.
  parameters:
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
      description: Token from session endpoint. POST also requires exact Origin and session cookie.
  responses:
    PlayerError:
      description: Invalid request (400), sign-in required (401), Origin/CSRF rejection (403), missing session (404), unsupported media type (415), rate limit (429), or unavailable dependency (503). No-store; 429 includes Retry-After.
      content:
        application/json:
          schema:
            type: object
            required: [version, error]
            properties:
              version: { type: integer, const: 1 }
              error: { type: string }
    Error:
      description: Rejected request (400/401/403/415), rate limit (429 with Retry-After), or unavailable dependency (503)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    PlayerGuildMark:
      type: [object, 'null']
      additionalProperties: false
      required: [url, updatedAt]
      properties:
        url: { type: string, description: Public address of the stored guild mark }
        updatedAt: { type: string, format: date-time }
    PlayerGuildMarkResult:
      type: object
      additionalProperties: false
      required: [version, mark]
      properties:
        version: { type: integer, const: 1 }
        mark: { $ref: '#/components/schemas/PlayerGuildMark' }
    PlayerGuildManagement:
      type: object
      additionalProperties: false
      required: [version, guild, character, rank, leader, marksEnabled, mark, source]
      properties:
        version: { type: integer, const: 1 }
        guild:
          type: object
          additionalProperties: false
          required: [id, name, kingdom, fame, members]
          properties:
            id: { type: integer }
            name: { type: string }
            kingdom: { type: integer, enum: [0, 7, 8] }
            fame: { type: integer, minimum: 0 }
            members:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, rank]
                properties:
                  name: { type: string }
                  rank: { type: integer, enum: [0, 6, 7, 8, 9] }
        character: { type: string, description: The account's character in this guild }
        rank: { type: integer, enum: [0, 6, 7, 8, 9] }
        leader: { type: boolean }
        marksEnabled: { type: boolean }
        mark: { $ref: '#/components/schemas/PlayerGuildMark' }
        source: { type: string, const: persisted snapshot }
    PublicGuildProfile:
      type: object
      additionalProperties: false
      required: [name, kingdom, fame, createdAt, members, ally, warTarget]
      properties:
        name: { type: string, minLength: 1, maxLength: 12 }
        kingdom: { type: integer, enum: [0, 7, 8] }
        fame: { type: integer, minimum: 0, maximum: 4294967295, description: Guild Fame, distinct from character Fame and premium currency }
        createdAt: { type: string, format: date-time, description: Saved creation time; zero time means unknown and is not shown }
        ally: { type: [string, 'null'], description: Allied guild name, or null }
        warTarget: { type: [string, 'null'], description: Declared war target, not a war history or active-war assertion }
        members:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, rank]
            properties:
              name: { type: string, minLength: 1, maxLength: 16 }
              rank: { type: integer, enum: [0, 6, 7, 8, 9], description: Member 0, officer slots 6-8, leader 9 }
    PlayerProfileResponse:
      type: object
      required: [version, profile]
      properties:
        version: { type: integer, const: 1 }
        profile:
          type: object
          required: [username, donate, createdAt, asOf, characters]
          properties:
            username: { type: string }
            donate: { type: integer, description: Saved Cash balance; no payment or credit operation is exposed }
            createdAt: { type: string, format: date-time }
            asOf: { type: string, format: date-time, description: Persisted accounts.updated_at from the same SQL statement }
            characters:
              type: array
              maxItems: 4
              items:
                type: object
                required: [slot, name, class, level, evolution]
                properties:
                  slot: { type: integer, minimum: 0, maximum: 3 }
                  name: { type: string }
                  class: { type: integer, minimum: 0, maximum: 255 }
                  level: { type: integer, minimum: 0, maximum: 4294967295, description: Native zero-based level; presentation adds one }
                  evolution: { type: string }
    PlayerStorageResponse:
      type: object
      additionalProperties: false
      required: [version, storage, source]
      properties:
        version: { type: integer, const: 1 }
        source: { type: string, const: persisted snapshot }
        storage:
          type: object
          additionalProperties: false
          required: [asOf, capacity, items]
          properties:
            asOf: { type: string, format: date-time }
            capacity: { type: integer, enum: [63, 120] }
            characterSlot: { type: integer, minimum: 0, maximum: 3, description: Inventory only }
            gold: { type: integer, minimum: 0, maximum: 4294967295, description: Cargo only }
            items:
              type: array
              maxItems: 120
              items:
                type: object
                additionalProperties: false
                required: [slot, itemId, name, effects, quantity]
                properties:
                  slot: { type: integer, minimum: 0, maximum: 119, description: Zero-based; inventory maximum is 62 }
                  itemId: { type: integer, minimum: 1, maximum: 65535 }
                  name: { type: string, description: Authoritative catalogue name or empty for unknown items }
                  quantity: { type: integer, minimum: 1, maximum: 255, description: Server-resolved quantity, not mount HP }
                  effects:
                    type: array
                    minItems: 6
                    maxItems: 6
                    items: { type: integer, minimum: 0, maximum: 255 }
    PlayerCharacterResponse:
      type: object
      required: [version, character, source]
      properties:
        version: { type: integer, const: 1 }
        source: { type: string, const: persisted snapshot }
        character:
          type: object
          additionalProperties: false
          required: [slot, name, class, level, evolution, asOf, exp, gold, cp, equipment, ascension, celestialAscension, subCelestialAscension]
          properties:
            slot: { type: integer, minimum: 0, maximum: 3 }
            name: { type: string }
            class: { type: integer, minimum: 0, maximum: 255 }
            level: { type: integer, minimum: 0, maximum: 4294967295, description: Native zero-based level; presentation adds one }
            evolution: { type: string }
            asOf: { type: string, format: date-time }
            exp: { type: integer, minimum: 0, maximum: 4294967295 }
            gold: { type: integer, minimum: 0, maximum: 4294967295 }
            cp: { type: integer, minimum: -75, maximum: 75 }
            fame: { type: integer, minimum: 0, maximum: 4294967295, description: Saved character Fame from the owner-bound progression view; not CP or an account balance. Absent in older replies. }
            ascension: { $ref: '#/components/schemas/PlayerArchAscension' }
            celestialAscension: { $ref: '#/components/schemas/PlayerCelestialAscension' }
            subCelestialAscension: { $ref: '#/components/schemas/PlayerSubCelestialAscension' }
            equipment:
              type: array
              maxItems: 15
              items:
                type: object
                additionalProperties: false
                required: [slot, itemId, name, effects]
                properties:
                  slot: { type: integer, minimum: 1, maximum: 15 }
                  itemId: { type: integer, minimum: 1, maximum: 65535 }
                  name: { type: string, description: Authoritative item name or empty for an unknown item }
                  effects:
                    type: array
                    minItems: 6
                    maxItems: 6
                    items: { type: integer, minimum: 0, maximum: 255 }
    PlayerArchAscension:
      type: object
      additionalProperties: false
      description: Saved Arch gates shared with the king interaction; not a guarantee that a live operation will succeed. Only Mortal characters are applicable.
      required: [applicable, requirementsMet, requiredLevel, checks]
      properties:
        applicable: { type: boolean }
        requirementsMet: { type: boolean }
        requiredLevel: { type: integer, minimum: 1, maximum: 4294967296, description: Displayed level, not the internal zero-based score }
        checks:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [id, met]
            properties:
              id: { type: string, enum: [mortal, level, eternalStone, sefirot, freeSlot] }
              met: { type: boolean }
    PlayerCelestialAscension:
      type: object
      additionalProperties: false
      description: Saved Arch-to-Celestial gates shared with the Ideal Stone operation. Origin level is its saved cache. Runtime transformation, trade and persistence remain game validations, not website authorization.
      required: [applicable, requirementsMet, requiredLevel, requiredMortalLevel, checks]
      properties:
        applicable: { type: boolean }
        requirementsMet: { type: boolean }
        requiredLevel: { type: integer, minimum: 1, maximum: 4294967296, description: Displayed Arch level }
        requiredMortalLevel: { type: integer, minimum: 1, maximum: 4294967296, description: Displayed source Mortal level }
        checks:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [id, met]
            properties:
              id: { type: string, enum: [arch, level, mortalLevel, idealStone] }
              met: { type: boolean }
    PlayerSubCelestialAscension:
      type: object
      additionalProperties: false
      description: Saved Celestial-to-SubCelestial requirements. Fame is character-specific; face validity and reward space after consuming an Ideal Stone are included. No alternate form, raw counter, UID or inventory is exposed. Live reservations, item materialization and persistence remain game validations.
      required: [applicable, requirementsMet, requiredLevel, requiredFame, checks]
      properties:
        applicable: { type: boolean }
        requirementsMet: { type: boolean }
        requiredLevel: { type: integer, minimum: 1, maximum: 4294967296, description: Displayed Celestial level }
        requiredFame: { type: integer, minimum: 0, maximum: 4294967295 }
        checks:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [id, met]
            properties:
              id: { type: string, enum: [celestial, level, fame, sefirot, idealStone, noAlternate, face, rewardSpace] }
              met: { type: boolean }
    PlayerSessions:
      type: object
      required: [version, asOf, sessions]
      properties:
        version: { type: integer, const: 1 }
        asOf: { type: string, format: date-time }
        sessions:
          type: array
          maxItems: 512
          items:
            type: object
            required: [id, current, createdAt, lastSeenAt, expiresAt]
            properties:
              id: { type: string, pattern: '^[a-f0-9]{64}$', description: Random display identifier independent of cookie and CSRF token }
              current: { type: boolean }
              createdAt: { type: string, format: date-time }
